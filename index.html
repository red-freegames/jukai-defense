<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>呪界ディフェンス</title>
<meta name="theme-color" content="#030205">
<meta name="description" content="呪霊が押し寄せる呪界を、5人の術師で守り抜け。漆黒とネオンのダークオカルト・タワーディフェンス。キャラを配置・強化し、必殺技のカットインで一掃せよ。全5ステージ・25WAVE、スマホ縦画面対応。">
<meta property="og:title" content="呪界ディフェンス">
<meta property="og:description" content="5人の術師を配置して呪霊の群れを迎え撃つダークオカルト・タワーディフェンス。必殺技カットインで一掃せよ。全5ステージ・25WAVE。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://red-freegames.github.io/jukai-defense/">
<meta property="og:image" content="https://red-freegames.github.io/jukai-defense/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://red-freegames.github.io/jukai-defense/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@300;500;700&family=Zen+Kaku+Gothic+New:wght@300;500;700&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
/* ===== サイバー・オカルトUI：漆黒＋極細ネオン＋ゴールド／クリムゾン ===== */
:root{--bg:#030205;--ink:#0a070e;--glass:rgba(12,8,18,.86);--line:rgba(212,175,55,.28);--gold:#d4af37;--gold2:#f3d98b;--crim:#c4122f;--crim2:#ff2a4a;--neon:#b84dff;--cyan:#5fe6ff;--txt:#ece4d6;--dim:#8d8299;
  --f-ui:'Rajdhani','Zen Kaku Gothic New',sans-serif;--f-jp:'Zen Kaku Gothic New',sans-serif;--f-brush:'Yuji Syuku','Zen Kaku Gothic New',serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;color:var(--txt);font-family:var(--f-jp);font-weight:300;overflow:hidden;touch-action:manipulation;
  background:radial-gradient(ellipse at 50% -10%,rgba(196,18,47,.18),transparent 55%),radial-gradient(ellipse at 50% 120%,rgba(120,40,200,.16),transparent 60%),var(--bg)}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1280px;margin:0 auto}
/* HUD */
#hud{display:flex;align-items:center;gap:8px;padding:7px 12px;background:linear-gradient(180deg,rgba(18,10,24,.95),rgba(6,3,10,.95));border-bottom:1px solid var(--line);position:relative}
#hud::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--crim2),var(--gold),var(--crim2),transparent);opacity:.8}
#hud .title{font-family:var(--f-brush);font-size:20px;margin-right:auto;color:#fff;letter-spacing:2px;text-shadow:0 0 10px rgba(255,42,74,.8),0 0 2px #fff;white-space:nowrap}
#hud .title small{font-family:var(--f-ui);font-weight:500;font-size:9px;color:var(--gold);letter-spacing:4px;margin-left:8px;text-shadow:none}
.stat{display:flex;align-items:baseline;gap:5px;padding:2px 10px;border-left:1px solid var(--line);font-family:var(--f-ui);font-size:10px;font-weight:500;letter-spacing:2px;color:var(--dim);white-space:nowrap;text-transform:uppercase}
.stat b{font-family:var(--f-ui);font-weight:500;font-size:19px;letter-spacing:1px;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.35)}
#money b{color:var(--gold2);text-shadow:0 0 10px rgba(212,175,55,.7)}
#life b{color:var(--crim2);text-shadow:0 0 10px rgba(255,42,74,.8)}
#stage b,#wvN{color:var(--cyan);text-shadow:0 0 10px rgba(95,230,255,.6)}
.stat.wg{align-items:center}
.gauge{display:flex;gap:3px;margin-left:4px}
.gauge i{display:block;width:20px;height:4px;background:rgba(255,255,255,.08);overflow:hidden}
.gauge i u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 8px var(--gold);transition:width .2s}
.gauge i.boss u{background:linear-gradient(90deg,var(--crim),var(--crim2));box-shadow:0 0 8px var(--crim2)}
.gauge i.now{outline:1px solid rgba(255,255,255,.5)}
/* ボタン */
.btn{font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:2px;padding:7px 14px;cursor:pointer;white-space:nowrap;position:relative;
  color:var(--gold2);background:linear-gradient(180deg,rgba(40,28,10,.9),rgba(10,6,4,.95));border:1px solid rgba(212,175,55,.6);
  box-shadow:inset 0 1px 0 rgba(255,230,160,.18),0 0 0 rgba(212,175,55,0);transition:box-shadow .15s,color .15s,border-color .15s,transform .05s;text-shadow:0 0 6px rgba(212,175,55,.5)}
.btn:hover:not(:disabled){color:#fff;border-color:var(--gold2);box-shadow:inset 0 1px 0 rgba(255,230,160,.3),0 0 14px rgba(212,175,55,.55)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{color:#4e4658;border-color:#2a2433;background:#0b0910;cursor:not-allowed;text-shadow:none;box-shadow:none}
.btn.red{color:#fff;background:linear-gradient(180deg,#8a0a20,#3a020c);border-color:var(--crim2);text-shadow:0 0 8px rgba(255,80,100,.8)}
.btn.red:hover:not(:disabled){box-shadow:0 0 18px rgba(255,42,74,.7);border-color:#ff7a8a}
.btn.blue{color:var(--txt);background:linear-gradient(180deg,rgba(30,22,40,.9),rgba(8,5,12,.95));border-color:rgba(255,255,255,.18);text-shadow:none}
.btn.blue:hover:not(:disabled){border-color:var(--neon);box-shadow:0 0 12px rgba(184,77,255,.5)}
#next:not(:disabled){color:#fff;background:linear-gradient(180deg,#a00c26,#40020c);border-color:var(--crim2);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(255,42,74,.75)}}
.spdseg{display:flex;border:1px solid rgba(212,175,55,.45)}
.spdseg button{font-family:var(--f-ui);font-weight:700;font-size:12px;letter-spacing:1px;border:none;background:transparent;color:var(--dim);padding:6px 10px;cursor:pointer;transition:all .15s}
.spdseg button+button{border-left:1px solid rgba(212,175,55,.25)}
.spdseg button:hover{color:#fff}
.spdseg button.on{background:linear-gradient(180deg,rgba(212,175,55,.35),rgba(212,175,55,.08));color:var(--gold2);text-shadow:0 0 8px var(--gold)}
.spdseg button[data-s="4"].on{background:linear-gradient(180deg,rgba(255,42,74,.45),rgba(255,42,74,.1));color:#fff;text-shadow:0 0 8px var(--crim2)}
/* 盤面 */
#wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
canvas#cv{display:block;touch-action:none;background:#000;border:1px solid rgba(212,175,55,.35);box-shadow:0 0 0 1px #000,0 0 40px rgba(196,18,47,.25),0 0 80px rgba(120,40,200,.15)}
/* ショップ（キャラカード） */
#panel{display:flex;gap:8px;padding:8px 10px;background:linear-gradient(0deg,rgba(18,10,24,.97),rgba(6,3,10,.97));border-top:1px solid var(--line);overflow-x:auto;justify-content:safe center;position:relative}
.card{position:relative;display:flex;align-items:center;gap:8px;flex:0 0 auto;width:150px;padding:4px 10px 4px 4px;cursor:pointer;
  background:linear-gradient(135deg,rgba(26,18,34,.95),rgba(8,5,12,.95));border:1px solid rgba(255,255,255,.08);transition:border-color .15s,box-shadow .15s,transform .1s}
.card::before{content:"";position:absolute;left:0;top:0;width:10px;height:10px;border-left:1px solid var(--gold);border-top:1px solid var(--gold);opacity:.7}
.card::after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-right:1px solid var(--gold);border-bottom:1px solid var(--gold);opacity:.7}
.card:hover{border-color:rgba(212,175,55,.6);box-shadow:0 0 16px rgba(212,175,55,.25);transform:translateY(-2px)}
.card.sel{border-color:var(--crim2);box-shadow:0 0 18px rgba(255,42,74,.5),inset 0 0 20px rgba(255,42,74,.15);transform:translateY(-3px)}
.card canvas{width:50px;height:50px;flex:none;border:1px solid rgba(212,175,55,.35)}
.card .nm{font-family:var(--f-jp);font-weight:500;font-size:10px;line-height:1.25;color:var(--txt);padding-right:12px}
.card .cs{font-family:var(--f-ui);font-weight:700;font-size:17px;letter-spacing:1px;color:var(--gold2);text-shadow:0 0 8px rgba(212,175,55,.6)}
.card .tg{position:absolute;top:3px;right:4px;font-family:var(--f-jp);font-weight:700;font-size:8px;padding:0 4px;color:#000;opacity:.85}
.card.poor{opacity:.35;filter:grayscale(.7)}
/* 強化パネル */
#pop{position:absolute;display:none;width:270px;padding:12px;z-index:5;font-size:12px;background:var(--glass);backdrop-filter:blur(6px);
  border:1px solid rgba(212,175,55,.45);box-shadow:0 0 0 1px #000,0 10px 40px rgba(0,0,0,.7),0 0 26px rgba(196,18,47,.25)}
#pop::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--crim2),var(--gold),transparent)}
#pop .phead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
#pop canvas{width:92px;height:73px;flex:none;border:1px solid rgba(212,175,55,.4)}
#pop .pt{font-family:var(--f-brush);font-size:16px;line-height:1.25;color:#fff;padding-right:14px;text-shadow:0 0 8px rgba(255,42,74,.6)}
#pop .lvp{display:flex;align-items:center;gap:3px;margin:5px 0}
#pop .lvp b{width:16px;height:3px;background:rgba(255,255,255,.12)}
#pop .lvp b.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
#pop .lvp span{font-family:var(--f-ui)}
#pop .pr{font-size:10px;color:var(--crim2);letter-spacing:.5px}
#pop .bars{display:grid;grid-template-columns:34px 1fr;gap:4px 8px;align-items:center;font-size:10px;color:var(--dim);margin-bottom:8px}
#pop .bar{height:3px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
#pop .bar s{position:absolute;inset:0 auto 0 0;background:rgba(212,175,55,.3)}
#pop .bar u{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 6px var(--gold)}
#pop .ps{color:#cfc6d8;margin-bottom:4px;line-height:1.6;border-left:1px solid var(--line);padding:2px 0 2px 8px;font-size:11px}
#pop .ctbar{height:2px;background:rgba(255,255,255,.08);margin-top:8px}
#pop .ctbar div{height:100%;background:linear-gradient(90deg,var(--crim),var(--crim2));box-shadow:0 0 6px var(--crim2)}
#pop .btn{display:block;width:100%;margin-top:7px;font-size:12px;letter-spacing:1px;white-space:normal;line-height:1.35}
#pop .btn.up{color:#eaffef;background:linear-gradient(180deg,rgba(20,90,50,.9),rgba(4,24,12,.95));border-color:#4ade80;text-shadow:0 0 6px rgba(74,222,128,.6)}
#pop .btn.up:hover:not(:disabled){box-shadow:0 0 14px rgba(74,222,128,.5)}
#pop .btn.up:disabled{color:#4e4658;border-color:#2a2433;background:#0b0910;text-shadow:none}
#pop .x{position:absolute;right:8px;top:6px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;font-family:var(--f-ui)}
#pop .x:hover{color:#fff}
/* 結果画面 */
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:10;text-align:center;padding:10px;
  background:radial-gradient(ellipse,rgba(40,4,12,.85),rgba(0,0,0,.95))}
#over h1{font-family:var(--f-brush);font-weight:400;font-size:58px;letter-spacing:6px;text-shadow:0 0 20px currentColor,0 0 2px #fff}
#over p{font-size:14px;line-height:1.9;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 22px;color:#ddd}
#over .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:5px 14px;font-size:12px;border:1px solid var(--line);color:var(--gold2);pointer-events:none;display:none;white-space:nowrap;z-index:4;letter-spacing:1px}
/* タイトル／ステージ選択 */
#title{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;overflow-x:hidden;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 38%,rgba(120,10,30,.35),transparent 55%),radial-gradient(ellipse at 50% 100%,rgba(90,30,160,.25),transparent 60%),#020103}
#title .sigil{position:absolute;left:50%;top:34%;width:520px;height:520px;margin:-260px 0 0 -260px;opacity:.45;pointer-events:none;animation:spin 60s linear infinite}
#title .sigil.s2{width:340px;height:340px;margin:-170px 0 0 -170px;opacity:.35;animation:spin 40s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
#title::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
#title .logo{text-align:center;position:relative;z-index:1;line-height:1}
#title .l1{font-family:var(--f-brush);font-size:84px;color:#fff;letter-spacing:10px;text-shadow:0 0 18px rgba(255,42,74,.95),0 0 46px rgba(196,18,47,.8),0 0 2px #fff}
#title .l2{font-family:var(--f-ui);font-weight:300;font-size:20px;letter-spacing:16px;margin-top:6px;color:var(--gold2);text-shadow:0 0 10px rgba(212,175,55,.8)}
#title .sub{font-family:var(--f-ui);font-weight:500;font-size:10px;color:var(--dim);letter-spacing:6px;margin-top:10px}
#title .sel-h{position:relative;z-index:1;font-family:var(--f-ui);font-weight:500;color:var(--gold);letter-spacing:8px;font-size:12px;margin-top:8px}
#title .tip{position:relative;z-index:1;font-size:11px;color:var(--dim);letter-spacing:1px}
#stages{position:relative;z-index:1;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:900px}
.stg{width:158px;cursor:pointer;padding:6px;position:relative;background:linear-gradient(160deg,rgba(26,16,32,.95),rgba(6,3,10,.95));border:1px solid rgba(212,175,55,.35);transition:transform .15s,box-shadow .15s,border-color .15s}
.stg:hover{transform:translateY(-4px);border-color:var(--gold2);box-shadow:0 0 22px rgba(212,175,55,.4),0 0 40px rgba(196,18,47,.3)}
.stg canvas{width:100%;display:block;aspect-ratio:24/13;border:1px solid rgba(0,0,0,.6)}
.stg .no{font-family:var(--f-ui);font-weight:700;font-size:11px;color:var(--gold);letter-spacing:4px;margin-top:6px}
.stg .nm{font-family:var(--f-brush);font-size:13px;color:#fff;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg .df{font-size:10px;color:var(--crim2);letter-spacing:1px;margin-top:2px}
.stg .badge{position:absolute;top:10px;right:10px;font-family:var(--f-ui);font-weight:700;font-size:9px;letter-spacing:2px;border:1px solid var(--gold);color:var(--gold2);background:rgba(0,0,0,.7);padding:0 5px}
.stg.lock{cursor:not-allowed;filter:grayscale(1) brightness(.4)}
.stg.lock:hover{transform:none;box-shadow:none}
.stg.lock::after{content:"封印中";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-brush);font-size:20px;color:#fff;letter-spacing:4px}
@media (max-width:1060px){#hud .title small{display:none}#hud .title{font-size:16px}.stat b{font-size:16px}.gauge i{width:14px}.card{width:138px}}
@media (max-width:700px){
  #hud .title{display:none}
  .stat{padding:2px 5px;font-size:8px;letter-spacing:1px}.stat b{font-size:13px}.btn{font-size:11px;padding:4px 7px}
  .spdseg button{font-size:10px;padding:3px 5px}.gauge i{width:10px}
  .card{width:auto;flex-direction:column;gap:2px;padding:4px;text-align:center}.card canvas{width:36px;height:36px}.card .nm{font-size:9px;max-width:72px;padding:0}.card .cs{font-size:12px}
  #over h1{font-size:36px}#title .l1{font-size:52px}#title .l2{font-size:14px;letter-spacing:8px}.stg{width:118px}#title .sigil{width:340px;height:340px;margin:-170px 0 0 -170px}
}
/* ===== 縦画面（スマホ縦持ち）レイアウト ===== */
body{display:flex;justify-content:center;align-items:center}
#app{position:relative;width:100vw;max-width:none;height:100vh;height:100dvh;margin:0;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,rgba(196,18,47,.14),transparent 50%),#030205}
/* PCではスマホ型のフレームに収める */
@media (min-width:600px){
  body{background:radial-gradient(circle at 50% 50%,rgba(120,10,30,.25),transparent 45%),repeating-radial-gradient(circle at 50% 50%,rgba(212,175,55,.05) 0 1px,transparent 1px 46px),#020103}
  #app{width:min(480px,calc(min(100dvh,960px) * .5));height:min(calc(100dvh - 24px),960px);border:1px solid rgba(212,175,55,.5);border-radius:28px;
    box-shadow:0 0 0 7px #07040b,0 0 0 8px rgba(212,175,55,.22),0 0 70px rgba(196,18,47,.35),0 0 140px rgba(120,40,200,.25)}
}
#hud{flex:none;flex-wrap:nowrap;gap:0;padding:8px 8px 6px;justify-content:space-between;padding-top:calc(8px + env(safe-area-inset-top))}
#hud .title{display:block;font-size:17px;margin-right:2px;letter-spacing:1px}
#hud .title small{display:none}
.stat{flex-direction:column;align-items:flex-start;gap:0;padding:0 7px;font-size:8px;letter-spacing:1.5px;line-height:1.15}
.stat b{font-size:17px;margin:0}
.stat.wg{align-items:flex-start}
.gauge{margin:2px 0 0}.gauge i{width:11px;height:4px}
#wrap{flex:1;padding:4px;min-height:0}
canvas#cv{border-radius:6px}
#dock{flex:none;padding:6px 6px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(18,10,24,.98),rgba(6,3,10,.98));border-top:1px solid var(--line);position:relative}
#dock::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--crim2),var(--gold),var(--crim2),transparent)}
#panel{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0;background:none;border:none;overflow:visible}
#panel::before{display:none}
.card{width:auto;flex-direction:column;align-items:center;gap:0;padding:5px 0 0;text-align:center;overflow:hidden}
.card canvas{width:46px;height:46px}
.card .nm{display:none}
.card .cs{font-size:14px;margin-top:1px}
.card .tg{top:2px;right:2px;font-size:7px;padding:0 3px}
.card:hover{transform:none}
.card.sel{transform:translateY(-2px)}
.spb{display:block;width:100%;margin-top:4px;border:none;border-top:1px solid rgba(255,255,255,.08);background:#0b0910;color:#6d6388;font-family:var(--f-ui);font-weight:700;font-size:11px;letter-spacing:1px;padding:7px 0;position:relative;overflow:hidden;cursor:pointer}
.spb i{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:linear-gradient(90deg,rgba(196,18,47,.15),rgba(255,42,74,.35));transition:width .2s}
.spb span{position:relative}
.spb.none{color:#2e2838;pointer-events:none}
.spb.ready{color:#fff;background:linear-gradient(180deg,#b00c2a,#44020e);text-shadow:0 0 8px #ff2a4a;animation:pulse 1.2s infinite}
.spb.ready i{display:none}
#ctrl{display:flex;gap:6px;margin-top:7px;align-items:stretch}
#ctrl .btn{padding:11px 14px;font-size:14px}
#ctrl #next{flex:1;font-size:15px;letter-spacing:3px}
#ctrl .spdseg button{padding:11px 11px;font-size:13px}
#pop{left:6px;right:6px;width:auto;bottom:6px;top:auto;padding:10px 12px}
#pop .phead{margin-bottom:6px}
#pop .ps{font-size:10.5px}
#pop .btn{padding:9px 10px}
#hint{white-space:normal;max-width:92%;text-align:center;font-size:11px}
#title{padding:18px 14px;justify-content:safe center;gap:9px}
#title .sigil{width:420px;height:420px;margin:-210px 0 0 -210px;top:24%}
#title .sigil.s2{width:280px;height:280px;margin:-140px 0 0 -140px}
#title .l1{font-size:58px;letter-spacing:8px}
#title .l2{font-size:15px;letter-spacing:10px}
#stages{flex-direction:column;flex-wrap:nowrap;align-items:stretch;width:100%;max-width:360px;gap:8px}
.stg{width:auto;display:flex;align-items:center;gap:12px;padding:5px 10px 5px 6px}
.stg canvas{width:40px;aspect-ratio:9/13;flex:none}
.stg .info{flex:1;min-width:0}
.stg .no{margin-top:0}
.stg.lock::after{font-size:16px}

<script>
(()=>{
'use strict';
// 縦画面（スマホ縦持ち）用の盤面：13×24マス
// 盤面は9×13マス。スマホ縦画面の横幅いっぱいに広がる比率（1マスが画面上で約42px）
const W=360,H=520,CS=40,COLS=9,ROWS=13;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
const FONT='"Rajdhani","Zen Kaku Gothic New",sans-serif',FONT2='"Yuji Syuku","Zen Kaku Gothic New",serif';
let K=1;

const VIG=(()=>{const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.hypot(W,H)*.55);g.addColorStop(0,'rgba(10,0,4,0)');g.addColorStop(1,'rgba(10,0,4,.35)');return g})();
const SCAN=(()=>{const c=document.createElement('canvas');c.width=4;c.height=4;const x=c.getContext('2d');x.fillStyle='rgba(0,0,0,.05)';x.fillRect(0,3,4,1);return ctx.createPattern(c,'repeat')})();

// ===== ステージ =====
// ref=旧盤面でのルート長（マス）。ルートが短くなった分だけ敵を遅くして、通過時間＝難易度を保つ
// th: base/base2=地の色, acc/acc2=発光色, path=通路の底, fog=瘴気, rune=紋様の色, edge=通路の縁（明るいネオン）, floor=通路の床
const STAGES=[
  {name:'高専グラウンド（夜）',ref:56,path:[[1,-1],[1,3],[7,3],[7,7],[1,7],[1,10],[7,10],[7,12]],
    th:{base:'#110b20',base2:'#2a1848',acc:'#b84dff',acc2:'#ff3d9a',path:'#040208',fog:'rgba(150,70,255,.2)',rune:'#8a4dff',edge:'#7ef9ff',floor:'#1c1530'}},
  {name:'夕暮れの商店街',ref:54,path:[[1,-1],[1,10],[4,10],[4,2],[7,2],[7,12]],
    th:{base:'#1a0a0e',base2:'#3c1620',acc:'#ff5a3d',acc2:'#ffb347',path:'#050102',fog:'rgba(255,90,40,.17)',rune:'#d0452c',edge:'#ffd36b',floor:'#24141a'}},
  {name:'真夜中の駅地下',ref:69,path:[[7,-1],[7,11],[1,11],[1,1],[5,1],[5,8],[3,8],[3,4]],
    th:{base:'#08101e',base2:'#16294a',acc:'#3de3ff',acc2:'#9b5cff',path:'#010306',fog:'rgba(60,200,255,.16)',rune:'#2a8ad8',edge:'#5fffb0',floor:'#0f1e26'}},
  {name:'吹雪の離島',ref:56,path:[[1,-1],[1,2],[7,2],[7,5],[1,5],[1,8],[7,8],[7,11],[1,11],[1,12]],
    th:{base:'#0e1626',base2:'#243856',acc:'#a8dcff',acc2:'#ffffff',path:'#03050a',fog:'rgba(190,225,255,.17)',rune:'#6fa6d8',snow:true,edge:'#9fe8ff',floor:'#18243a'}},
  {name:'呪いの王の厨房',ref:111,path:[[1,-1],[1,1],[7,1],[7,3],[1,3],[1,5],[7,5],[7,7],[1,7],[1,9],[7,9],[7,11],[1,11],[1,12]],
    th:{base:'#180509',base2:'#3e0a14',acc:'#ff1a3a',acc2:'#ffb000',path:'#040001',fog:'rgba(255,20,40,.2)',rune:'#b0001c',edge:'#ffcf4a',floor:'#2a0e12'}}

const BOSS_ARM=[1,1,.8,.6,.5];   // ボスの通常攻撃耐性（必殺技は等倍）。STAGE3は .7→.8
let PATH=[],segs=[],pathLen=0,grid=[];

function posAt(d){
  for(const s of segs){if(d<=s.start+s.len){const t=Math.max(0,(d-s.start)/s.len);return{x:s.ax+(s.bx-s.ax)*t,y:s.ay+(s.by-s.ay)*t}}}
  const s=segs[segs.length-1];return{x:s.bx,y:s.by};
}
function setupStage(){
  const S=STAGES[G.stage-1];
  PATH=S.path.map(([c,r])=>[c*CS+CS/2,r*CS+CS/2]);
  segs=[];pathLen=0;
  for(let i=0;i<PATH.length-1;i++){
    const[ax,ay]=PATH[i],[bx,by]=PATH[i+1],len=Math.hypot(bx-ax,by-ay);
    segs.push({ax,ay,bx,by,len,start:pathLen});pathLen+=len;
  }
  // 旧盤面と同じ通過時間になるよう、敵の速度・押し戻し量をルート長の比で縮める
  G.spdK=(pathLen/CS)/S.ref;
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  for(let i=0;i<S.path.length-1;i++){
    let[c0,r0]=S.path[i];const[c1,r1]=S.path[i+1],dc=Math.sign(c1-c0),dr=Math.sign(r1-r0);
    for(;;){if(c0>=0&&c0<COLS&&r0>=0&&r0<ROWS)grid[r0][c0]=1;if(c0===c1&&r0===r1)break;c0+=dc;r0+=dr}
  }
  const[ec,er]=S.path[S.path.length-1];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const r=er+dr,c=ec+dc;if(r>=0&&r<ROWS&&c>=0&&c<COLS&&!grid[r][c])grid[r][c]=2}
  // 湧き口のまわりは置けない
  const sc0=Math.max(0,Math.min(COLS-1,S.path[0][0])),sr0=Math.max(0,Math.min(ROWS-1,S.path[0][1]));
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const r=sr0+dr,c=sc0+dc;if(r>=0&&r<ROWS&&c>=0&&c<COLS&&!grid[r][c])grid[r][c]=2}
  buildBg();
}

// arm: 通常攻撃のダメージ倍率（必殺技は等倍で通る）
const ETYPES={
  grunt:{hp:40,spd:52,r:12,rew:9,col:'#8e5cf0'},
  fast:{hp:26,spd:98,r:9,rew:10,col:'#f15bb5'},
  tank:{hp:220,spd:32,r:15,rew:24,col:'#2ec4b6'},
  armor:{hp:300,spd:38,r:14,rew:30,col:'#6f7fd8',arm:.45},
  boss:{hp:1,spd:22,r:28,rew:0,col:'#2b0f3a'}
};
// ステージ別の雑魚HP倍率（1〜2は易しめ、3から急上昇）
// 9×15の盤面ではタワーが通路を広く守れるため、STAGE3以降は耐久を1.7倍にして旧盤面と同等の手ごたえに
const HPM=[1,1.6,13.6,23.8,37.4];
function makeWave(st,wv){
  const g=(st-1)*5+wv,q=[];
  const n={grunt:5+2*wv+2*(st-1),fast:wv>=2||st>=2?wv+2*(st-1)-1:0,
    tank:st>=2||wv>=3?Math.floor((wv+2*st-3)/2):0,armor:st>=3?Math.floor((wv+st-2)/2):0};
  const gap={grunt:Math.max(.35,.9-.03*g),fast:.45,tank:1.2,armor:1.4};
  const pat=['grunt','fast','grunt','tank','armor'];let i=0;
  while(n.grunt+n.fast+n.tank+n.armor>0){const t=pat[i++%5];if(n[t]>0){n[t]--;q.push({t,gap:gap[t]})}}
  // ステージ3以降は途中で「群れ」が一気に押し寄せる（範囲必殺の使いどころ）
  if(st>=3&&wv>=2){const sw=[];for(let k=0;k<6+2*st+wv-(st===3&&wv===5?8:0);k++)sw.push({t:k%3?'fast':'grunt',gap:.13});
    sw[0].swarm=true;sw[sw.length-1].gap=1.5;q.splice(Math.floor(q.length*.5),0,...sw)}
  if(wv===5)q.push({t:'boss',gap:3});
  return q;
}

// ===== 状態 =====
let G;
// ステージ選択から始めた時の所持金（通しプレイで持ち越す額の目安）
const STAGE_MONEY=[400,2000,4500,9000,15000];
function newGame(n=1){
  G={stage:n,money:STAGE_MONEY[n-1],life:10,wave:0,state:'ready',towers:[],enemies:[],queue:[],spawnT:0,
     fx:[],parts:[],texts:[],rushes:[],shots:[],bombs:[],domain:0,domainLv:1,domX:W/2,domY:H/2,kitchen:0,kitchenLv:1,
     cutin:null,shake:0,shakeMag:0,time:0,incomeT:0,speed:G?G.speed:1,sel:null,placing:null,banner:null,hover:null,warn:0,winT:0,stageMoney:400};
  if(location.hash==='#debug')G.money=G.stageMoney=99999;
  startStage();
}
function startStage(){
  G.wave=0;G.life=10;G.state='ready';G.towers=[];G.enemies=[];G.queue=[];G.rushes=[];G.shots=[];G.bombs=[];
  G.domain=0;G.kitchen=0;G.warn=0;G.placing=null;G.stageMoney=G.money;
  setupStage();closePop();$('over').style.display='none';
  G.banner={text:`STAGE ${G.stage}「${STAGES[G.stage-1].name}」`,t:2.2,col:'#ffd23f'};
  syncUI(true);
}

// ===== 汎用エフェクト =====
function text(x,y,s,col,size=15){G.texts.push({x,y,s,col,size,life:.8,max:.8,vx:(Math.random()-.5)*30})}
function spark(x,y,col,big){if(G.fx.length<260)G.fx.push({k:'spark',x:x+(Math.random()-.5)*8,y:y+(Math.random()-.5)*8,col,big,a:Math.random()*.8,life:.14,max:.14})}
function burst(x,y,col,n,sp=120){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=sp*(.3+Math.random());G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5+Math.random()*.3,col,sz:2+Math.random()*3})}}
function shake(t,m){if(G.shake<=0)G.shakeMag=0;G.shake=Math.max(G.shake,t);G.shakeMag=Math.max(G.shakeMag,m)}
function cutin(type,x,y){const D=DEFS[type];G.cutin={type,txt:D.cut,sub:`${D.sp}（${D.spR}）`,col:D.col,el:0,max:2,x,y}}
const gIdx=()=>(G.stage-1)*5+Math.max(1,G.wave);

// sp=true は必殺技（装甲を無視）
function hurt(e,dmg,show,col,sp){
  if(e.dead)return;
  const blocked=!sp&&e.arm<1;if(blocked)dmg*=e.arm;
  e.hp-=dmg;e.flash=.08;
  if(show){text(e.x+(Math.random()*16-8),e.y-e.r-4,Math.round(dmg),blocked?'#8f9bd6':col||'#fff',sp?22:col?18:14);spark(e.x,e.y,blocked?'#8f9bd6':col||'#fff',sp)}
  if(e.hp<=0){
    e.dead=true;G.money+=e.rew;
    text(e.x,e.y-10,'+'+e.rew+'G','#ffd23f',13);
    burst(e.x,e.y,e.col,e.t==='boss'?60:10,e.t==='boss'?300:120);
    if(e.t==='boss'){shake(1,14);burst(e.x,e.y,'#ffd23f',60,350);if(G.stage===5)G.winT=1}
  }
}
function spawn(t,swarm){
  // STAGE3 WAVE5 は雑魚の耐久を少し抑えてボス戦に集中できるように
  const d=ETYPES[t],m=HPM[G.stage-1]*(1+.14*(Math.max(1,G.wave)-1))*(G.stage===3&&G.wave===5?.85:1);
  const hp=t==='boss'?BOSS_HP[G.stage-1]:d.hp*m;
  const rew=t==='boss'?250+150*G.stage:Math.round(d.rew*(1+.12*(G.stage-1)));
  const arm=t==='boss'?BOSS_ARM[G.stage-1]:d.arm||1;
  const p=posAt(0);
  G.enemies.push({t,d:0,x:p.x,y:p.y,hp,maxHp:hp,spd:d.spd*G.spdK,r:d.r,rew,col:d.col,arm,slow:0,flash:0,wob:Math.random()*6});
  if(swarm){G.banner={text:'呪霊の群れが押し寄せてくる！',t:1.6,col:'#ff3d9a'};shake(.4,5)}
  if(t==='boss'){G.warn=3;G.banner={text:'⚠️ 特級・ヤバい化け物 出現 ⚠️',t:2.6,col:'#ff4d6d'};shake(.8,7)}
}
const alive=()=>G.enemies.filter(e=>!e.dead);
const strongest=a=>a.reduce((x,y)=>y.hp>x.hp?y:x);

// ===== 必殺技 =====
// 必殺技の威力（LV倍率込み）
const SPV={yuji:[80,160,300],megumiPush:[160,220,280],megumiDmg:[60,130,260],nobara:[200,400,800],gojoDps:[90,180,350],sukunaDps:[220,450,850]};
function special(t){
  if(t.spCd>0||G.state!=='wave'&&G.state!=='ready')return;
  const L=t.lv,al=alive();
  if(!al.length){text(t.x,t.y-30,'敵がいない！','#aaa',14);return}
  switch(t.type){
    case 'yuji':G.rushes.push({t,tg:strongest(al),hits:8,timer:.4,dmg:SPV.yuji[L-1]});shake(.4,7);break;
    case 'megumi':
      for(const e of al){const push=(e.t==='boss'?.15:1)*SPV.megumiPush[L-1]*G.spdK;e.d=Math.max(0,e.d-push);const p=posAt(e.d);
        G.fx.push({k:'dog',x0:e.x,y0:e.y,x1:p.x,y1:p.y,life:.45,max:.45});e.x=p.x;e.y=p.y;hurt(e,SPV.megumiDmg[L-1],true,'#b388ff',true);
        G.fx.push({k:'puddle',x:p.x,y:p.y,life:1.2,max:1.2})}
      G.fx.push({k:'shadowwave',life:.9,max:.9});shake(.5,8);break;
    case 'nobara':{
      const pool=[...al].sort(()=>Math.random()-.5);
      for(let i=0;i<3;i++){const e=pool[i%pool.length];G.bombs.push({tg:e,x:e.x,y:e.y,t:.55+i*.25,dmg:SPV.nobara[L-1]})}
      shake(.3,5);break}
    case 'gojo':G.domain=5.4;G.domainLv=SPV.gojoDps[L-1];G.domX=t.x;G.domY=t.y;shake(1,12);G.fx.push({k:'nova',x:t.x,y:t.y,col:'#4de3ff',R:800,life:1,max:1});break;
    case 'sukuna':G.kitchen=4.4;G.kitchenLv=SPV.sukunaDps[L-1];shake(1.2,14);break;
  }
  cutin(t.type,t.x,t.y);t.spCd=DEFS[t.type].ct;closePop();
}

// ===== 更新 =====
const inR=(t,e,r)=>(e.x-t.x)**2+(e.y-t.y)**2<=(r+e.r)**2;
function update(dt){
  G.time+=dt;
  if(G.winT>0){G.winT-=dt;if(G.winT<=0){endGame(true);return}}
  if(G.state==='wave'){
    G.incomeT+=dt;if(G.incomeT>=1){G.incomeT-=1;G.money+=2}
    if(G.queue.length){G.spawnT-=dt;if(G.spawnT<=0){const it=G.queue.shift();spawn(it.t,it.swarm);G.spawnT=it.gap}}
  }
  if(G.warn>0)G.warn-=dt;
  const domainOn=G.domain>0&&G.domain<5;
  if(G.domain>0){G.domain-=dt;if(domainOn)for(const e of G.enemies){hurt(e,G.domainLv*dt,false,null,true);
    if(Math.random()<dt*.6)text(e.x,e.y-e.r-10,'ぐぅ〜','#9ad8ff',13)}}
  if(G.kitchen>0){G.kitchen-=dt;if(G.kitchen<4){for(const e of G.enemies)hurt(e,G.kitchenLv*dt,false,null,true);
    if(Math.random()<dt*25){const es=alive();if(es.length){const e=es[Math.random()*es.length|0];G.fx.push({k:'cut',x:e.x,y:e.y,a:Math.random()*3.14,len:70,life:.2,max:.2})}}
    if(Math.random()<dt*8)shake(.1,4);
    if(Math.random()<dt*3)G.fx.push({k:'cut',x:Math.random()*W,y:Math.random()*H,a:Math.random()*3.14,len:240,life:.28,max:.28})}}

  for(const t of G.towers){
    const D=DEFS[t.type],L=t.lv-1,R=D.range[L];
    t.cd=Math.max(0,t.cd-dt);t.spCd=Math.max(0,t.spCd-dt);t.anim=Math.max(0,t.anim-dt);
    let front=null;
    if(t.type!=='gojo'&&t.cd<=0)for(const e of G.enemies)if(!e.dead&&inR(t,e,R)&&(!front||e.d>front.d))front=e;
    switch(t.type){
      case 'yuji':if(front){hurt(front,D.dmg[L],true);t.cd=1/D.rate[L];t.anim=.1;t.face=front.x<t.x?-1:1;
        G.fx.push({k:'punch',x:front.x,y:front.y,life:.15,max:.15,lv:t.lv});if(Math.random()<.4)burst(front.x,front.y,'#ffe66d',3,80)}break;
      case 'megumi':if(front){t.cd=1/D.rate[L];t.anim=.25;t.face=front.x<t.x?-1:1;
        G.fx.push({k:'dog',x0:t.x,y0:t.y,x1:front.x,y1:front.y,life:.25,max:.25},{k:'claw',x:front.x,y:front.y,life:.25,max:.25,col:'#b388ff'});
        for(const e of G.enemies)if(!e.dead&&Math.hypot(e.x-front.x,e.y-front.y)<45+e.r){hurt(e,D.dmg[L],e===front);
          if(e.t!=='boss'){e.d=Math.max(0,e.d-D.push[L]*G.spdK);const p=posAt(e.d);e.x=p.x;e.y=p.y}}
        G.fx.push({k:'ring',x:front.x,y:front.y,r:8,to:45,life:.25,max:.25,col:'#7c4dff'})}break;
      case 'nobara':if(front){t.cd=1/D.rate[L];t.anim=.2;t.face=front.x<t.x?-1:1;
        G.shots.push({x:t.x+6*t.face,y:t.y-8,tg:front,dmg:D.dmg[L]})}break;
      case 'gojo':{let any=false;
        for(const e of G.enemies)if(!e.dead&&inR(t,e,R)){hurt(e,D.dmg[L]*dt,false);e.slow=Math.max(e.slow,D.slow[L]*(e.t==='boss'?.5:1));any=true;if(Math.random()<dt*2.5)G.fx.push({k:'zap',x0:t.x,y0:t.y-20,x1:e.x,y1:e.y,life:.15,max:.15});
          if(Math.random()<dt*5)G.parts.push({x:e.x,y:e.y,vx:0,vy:-30,life:.4,col:'#9ad8ff',sz:3})}
        t.active=any;break}
      case 'sukuna':if(front){t.cd=1/D.rate[L];t.anim=.2;t.face=front.x<t.x?-1:1;let n=0;
        for(const e of G.enemies)if(!e.dead&&inR(t,e,R)){hurt(e,D.dmg[L],true,null);
          if(n++<6)G.fx.push({k:'cut',x:e.x,y:e.y,a:Math.random()*3.14,len:e.r*2+24,life:.18,max:.18})}
        // 演出のみ：爪の斬撃と不気味な笑い
        G.fx.push({k:'claw',x:front.x,y:front.y,life:.3,max:.3});if(Math.random()<.1)text(t.x,t.y-50,['ケヒッ','ケヒヒ…','嗤'][Math.random()*3|0],'#ff2a3a',12)}break;
    }
  }

  for(const r of G.rushes){
    r.timer-=dt;
    if(r.timer<=0&&r.hits>0){
      if(r.tg.dead){const al=alive();if(!al.length){r.hits=0;continue}r.tg=strongest(al)}
      const e=r.tg;
      hurt(e,r.dmg*(r.hits===1?2:1),true,'#ff3030',true);
      G.fx.push({k:'bolt',x:e.x,y:e.y,life:.22,max:.22,seed:Math.random()*99});
      G.fx.push({k:'ring',x:e.x,y:e.y,r:10,to:70,life:.3,max:.3,col:'#ff2a2a'});
      burst(e.x,e.y,'#111',8,200);burst(e.x,e.y,'#ff2a2a',6,220);
      G.fx.push({k:'punch',x:e.x,y:e.y,life:.2,max:.2,col:'#ff2a2a'});if(r.hits===1)G.fx.push({k:'blackflash',x:e.x,y:e.y,seed:Math.random()*999,life:.35,max:.35});
      shake(.12,r.hits===1?12:5);r.t.anim=.1;r.t.face=e.x<r.t.x?-1:1;
      r.hits--;r.timer=.11;
    }
  }
  G.rushes=G.rushes.filter(r=>r.hits>0);

  for(const s of G.shots){
    const tx=s.tg.x,ty=s.tg.y,dx=tx-s.x,dy=ty-s.y,dd=Math.hypot(dx,dy),st=900*dt;
    if(dd<=st||s.tg.dead){if(!s.tg.dead){hurt(s.tg,s.dmg,true,'#ffb36b');burst(tx,ty,'#ffb36b',5,100);G.fx.push({k:'punch',x:tx,y:ty,life:.18,max:.18,col:'#ff8a3d'})}s.done=true}
    else{s.x+=dx/dd*st;s.y+=dy/dd*st;s.a=Math.atan2(dy,dx)}
  }
  G.shots=G.shots.filter(s=>!s.done);

  for(const b of G.bombs){
    if(!b.tg.dead){b.x=b.tg.x;b.y=b.tg.y}
    b.t-=dt;
    if(b.t<=0){b.done=true;
      for(const e of G.enemies)if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<60+e.r)hurt(e,b.dmg,true,'#ff8a3d',true);
      G.fx.push({k:'boom',x:b.x,y:b.y,life:.45,max:.45},{k:'nova',x:b.x,y:b.y,col:'#ff8a3d',R:110,life:.4,max:.4});burst(b.x,b.y,'#ff8a3d',22,260);burst(b.x,b.y,'#ffe66d',12,200);shake(.25,10)}
  }
  G.bombs=G.bombs.filter(b=>!b.done);

  const frozen=domainOn;
  for(const e of G.enemies){
    if(e.dead)continue;
    e.flash=Math.max(0,e.flash-dt);
    // ボスは領域でも完全には止まらない（半減速）
    e.d+=e.spd*(frozen?(e.t==='boss'?.5:0):1-e.slow)*dt;
    e.slow=0;
    const p=posAt(e.d);e.x=p.x;e.y=p.y;
    if(e.d>=pathLen){
      e.dead=true;const dmg=e.t==='boss'?10:1;G.life=Math.max(0,G.life-dmg);
      shake(.3,8);text(p.x,p.y-30,'-'+dmg+'♥','#ff4d6d',22);burst(p.x,p.y,'#ff4d6d',15);
      if(G.life<=0){endGame(false);return}
    }
  }
  G.enemies=G.enemies.filter(e=>!e.dead);

  if(G.state==='wave'&&!G.queue.length&&!G.enemies.length&&G.winT<=0){
    // WAVE4 クリア時はボス戦に備えた準備金を上乗せ
    const bonus=40+12*gIdx()+(G.wave===4?100*G.stage:0);G.money+=bonus;
    if(G.wave>=5){
      if(G.stage>=5){endGame(true);return}
      G.state='stageclear';closePop();G.placing=null;markClear(G.stage);
      const refund=G.towers.reduce((a,t)=>a+t.spent,0);G.money+=refund;
      showOver('STAGE CLEAR!','#ffd23f',`STAGE ${G.stage}「${STAGES[G.stage-1].name}」突破！<br>WAVEボーナス +${bonus}G<br>配置キャラは全額返金 +${refund}G（次のマップで再配置）<br>拠点ライフは全回復！`,
        '次のステージへ ▶',()=>{G.stage++;startStage()},'ステージ選択',showTitle);
    }else{G.state='ready';G.banner={text:G.wave===4?`ボス戦準備金 +${bonus}G`:`WAVE ${G.wave} CLEAR!  +${bonus}G`,t:2,col:'#ffd23f'}}
    syncUI(true);
  }
}
function updateFx(dt,rdt){
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;p.life-=dt}
  G.parts=G.parts.filter(p=>p.life>0);if(G.parts.length>600)G.parts.splice(0,G.parts.length-600);
  for(const t of G.texts){t.y-=40*dt;t.x+=t.vx*dt;t.life-=dt}
  G.texts=G.texts.filter(t=>t.life>0);if(G.texts.length>120)G.texts.splice(0,G.texts.length-120);
  for(const f of G.fx)f.life-=dt;
  G.fx=G.fx.filter(f=>f.life>0);
  // 画面揺れ・カットイン・バナーは倍速に関係なく実時間で進める
  if(G.shake>0)G.shake-=rdt;
  if(G.cutin){G.cutin.el+=rdt;if(G.cutin.el>=G.cutin.max){const c=G.cutin;G.cutin=null;
    // カットイン明け：呪力の解放（画面を駆け抜ける衝撃波＋閃光）
    G.fx.push({k:'nova',x:c.x,y:c.y,col:c.col,life:.7,max:.7},{k:'flash',col:c.col,a:.3,life:.3,max:.3});shake(.4,10)}}
  if(G.banner){G.banner.t-=rdt;if(G.banner.t<=0)G.banner=null}
}

function evilFlames(c,cx,cy,r,t,n=9,a=1){
  const g=c.createRadialGradient(cx,cy,r*.45,cx,cy,r*1.6);
  g.addColorStop(0,`rgba(255,40,50,${.85*a})`);g.addColorStop(.5,`rgba(150,0,20,${.6*a})`);g.addColorStop(1,'rgba(30,0,5,0)');
  c.fillStyle=g;c.beginPath();
  for(let i=0;i<n;i++){const an=-Math.PI/2+(i-(n-1)/2)*(2.6/n)*1.6,fl=1+.28*Math.sin(t*13+i*2.1),w=r*.3;
    const bx=cx+Math.cos(an)*r*.55,by=cy+Math.sin(an)*r*.55,tx=cx+Math.cos(an)*r*1.55*fl,ty=cy+Math.sin(an)*r*1.55*fl-r*.15;
    c.moveTo(bx-Math.sin(an)*w,by+Math.cos(an)*w);c.quadraticCurveTo(cx+Math.cos(an+.25)*r*1.1,cy+Math.sin(an+.25)*r*1.1,tx,ty);
    c.quadraticCurveTo(cx+Math.cos(an-.25)*r*1.1,cy+Math.sin(an-.25)*r*1.1,bx+Math.sin(an)*w,by-Math.cos(an)*w);c.closePath()}
  c.fill();
}

    if(G.money<D.cost){text(h.x,h.y,'マネー不足！','#ff4d6d');return}
    const s=snapCell(h);
    if(!s){text(h.x,h.y,towerHit(h.x,h.y)?'もう誰かいる！':'そこには置けない！','#ff4d6d');return}
    G.money-=D.cost;const x=s.c*CS+CS/2,y=s.r*CS+CS/2;
    const t={type:G.placing,c:s.c,r:s.r,x,y,lv:1,cd:0,spCd:D.ct*.3,anim:0,face:1,spent:D.cost};G.towers.push(t);
    burst(x,y,'#fff',14);G.fx.push({k:'ring',x,y,r:5,to:36,life:.3,max:.3,col:'#fff'});
    showUndo(t);
    if(!ev.shiftKey)G.placing=null;
    syncUI(true);return;
  }
  const hit=towerHit(h.x,h.y);
  if(hit){openPop(hit);return}
  closePop();
});
$('cancelPlace').onclick=()=>{G.placing=null;G.hover=null;syncUI(true)};
$('undo').onclick=()=>{const t=G.undoT;if(t&&G.towers.includes(t)&&t.lv===1){G.money+=t.spent;G.towers=G.towers.filter(o=>o!==t);if(G.sel===t)closePop();text(t.x,t.y,'+'+t.spent+'G','#ffd23f')}hideUndo();syncUI(true)};
window.addEventListener('keydown',ev=>{if(ev.key==='Escape'){G.placing=null;closePop();syncUI(true)}});

// ===== UI =====
function $(id){return document.getElementById(id)}
// キャラごとの必殺ボタン：同じキャラの中で一番レベルの高い準備済みタワーが撃つ
const spbs={};
function fireType(k){const r=G.towers.filter(t=>t.type===k&&t.spCd<=0).sort((a,b)=>b.lv-a.lv)[0];if(r)special(r)}
function syncSp(){
  const live=(G.state==='wave'||G.state==='ready')&&G.enemies.length>0;
  for(const k in spbs){const b=spbs[k],ts=G.towers.filter(t=>t.type===k);
    if(!ts.length){b.className='spb none';b.lastChild.textContent='必殺';b.style.setProperty('--p','0%');continue}
    const p=Math.max(...ts.map(t=>1-t.spCd/DEFS[k].ct)),rd=p>=1;
    b.className='spb'+(rd&&live?' ready':'');b.style.setProperty('--p',Math.min(100,p*100)+'%');
    b.lastChild.textContent=rd?'必殺！':`${Math.ceil(Math.min(...ts.map(t=>t.spCd)))}s`}
}
const cards={};
for(const k of Object.keys(DEFS)){
  const d=DEFS[k],el=document.createElement('div');el.className='card';
  const ic=document.createElement('canvas');ic.width=96;ic.height=96;
  const ic2=ic.getContext('2d'),bgr=ic2.createRadialGradient(48,40,4,48,48,70);
  bgr.addColorStop(0,d.col);bgr.addColorStop(1,'#0b0617');ic2.fillStyle=bgr;ic2.fillRect(0,0,96,96);
  drawBust(ic2,k,48,48,.56);
  el.appendChild(ic);
  const info=document.createElement('div');info.innerHTML=`<div class="nm">${d.name}</div><div class="cs">${d.cost}G</div><span class="tg" style="background:${d.col}">${d.tag}</span>`;el.appendChild(info);
  el.onclick=()=>{if(G.state!=='ready'&&G.state!=='wave')return;closePop();G.placing=G.placing===k?null:k;syncUI(true)};
  const sb=document.createElement('button');sb.className='spb none';sb.innerHTML='<i></i><span>必殺</span>';sb.onclick=ev=>{ev.stopPropagation();fireType(k)};el.appendChild(sb);spbs[k]=sb;
  $('panel').appendChild(el);cards[k]=el;
}
// 押した瞬間にキュッと沈む（:activeはスマホで反応しにくいので自前で付け外し）
{const PS='.btn,.card,.homebtn,.spdseg button,.spb,.stg,.fb-link,.site-foot a';let pr=[];
 const off=()=>{pr.forEach(e=>e.classList.remove('press'));pr=[]};
 document.addEventListener('pointerdown',e=>{off();const t=e.target.closest&&e.target.closest(PS);if(!t||t.disabled)return;
   pr=[t];t.classList.add('press')},{passive:true});
 ['pointerup','pointercancel','pointerleave'].forEach(n=>document.addEventListener(n,off,{passive:true}));}
$('next').onclick=()=>{
  if(G.state!=='ready'||G.wave>=5)return;
  G.wave++;G.queue=makeWave(G.stage,G.wave);G.waveTotal=G.queue.length;G.state='wave';G.spawnT=.6;
  const fin=G.stage===5&&G.wave===5;
  G.banner={text:fin?'FINAL WAVE !!':`STAGE ${G.stage} - WAVE ${G.wave} START`,t:1.6,col:fin||G.wave===5?'#ff4d6d':'#fff'};

};
/* =====================================================
   RED FREE GAMES 共通（他のゲーム・要望フォーム・アクセス解析・HOME）
===================================================== */
const SITE_URL='https://red-freegames.github.io/';
// 要望・バグ報告フォーム（共通のGoogleフォーム）。「対象のゲーム」に同じ名前の選択肢を追加すると選択済みで開く
const GAME_NAME='呪界ディフェンス';
const FEEDBACK_VIEW='https://docs.google.com/forms/d/e/1FAIpQLSfJ2DevI46AJiB_kUAmPGOvckFRqzzSP_iCVd5qiikxr9SIOg/viewform';
$('fbTitle').href=$('fbResult').href=`${FEEDBACK_VIEW}?usp=pp_url&entry.2056875219=${encodeURIComponent(GAME_NAME)}`;
// アクセス解析（Googleアナリティクス4）。本番（github.io）でだけ計測し、画面には何も出さない
const GA_ID='G-FC7LD0DJTQ';
(function initAnalytics(){
  if(!GA_ID||!/\.github\.io$/.test(location.hostname))return;
  window.dataLayer=window.dataLayer||[];
  window.gtag=function(){dataLayer.push(arguments)};
  gtag('js',new Date());gtag('config',GA_ID,{page_title:GAME_NAME});

// ゲーム内の出来事を記録する（失敗しても遊びには影響させない）
const track=(name,params)=>{try{if(window.gtag)gtag('event',name,params||{})}catch(e){}};
// HOME：タイトル（ステージ選択）へ戻る。プレイ中は一時停止して確認を挟む
$('homeBtn').onclick=()=>{
  if(G.state==='title')return;
  if(G.state==='win'||G.state==='lose'||G.state==='stageclear'||(G.wave===0&&!G.towers.length)){showTitle();return}

};
$('homeNo').onclick=()=>{G.paused=false;$('homeOv').style.display='none'};
$('homeYes').onclick=()=>{$('homeOv').style.display='none';track('home_return',{stage:G.stage,wave:G.wave});showTitle()};
// ===== ステージ選択 =====
const PROG_KEY='jkd_progress';
function loadProg(){try{return JSON.parse(localStorage.getItem(PROG_KEY))||{un:1,cl:[]}}catch(e){return{un:1,cl:[]}}}
function markClear(st){track('stage_clear',{stage:st});const p=loadProg();p.un=Math.max(p.un,Math.min(5,st+1));if(!p.cl.includes(st))p.cl.push(st);try{localStorage.setItem(PROG_KEY,JSON.stringify(p))}catch(e){}}
function drawPreview(c,S){
  const k=96/W,pts=S.path.map(([a,b])=>[(a*CS+CS/2)*k,(b*CS+CS/2)*k]);
  c.fillStyle=S.th.base2;c.fillRect(0,0,96,139);
  c.strokeStyle='rgba(255,255,255,.05)';for(let i=0;i<96;i+=CS*k){c.beginPath();c.moveTo(i,0);c.lineTo(i,139);c.stroke()}
  const ln=(w,col)=>{c.lineWidth=w;c.strokeStyle=col;c.lineJoin='miter';c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke()};
  c.shadowColor=S.th.edge;c.shadowBlur=6;ln(CS*k+2,S.th.edge);c.shadowBlur=0;ln(CS*k-1,S.th.floor);
  const[ex,ey]=pts[pts.length-1];c.fillStyle='#ff3d6d';c.shadowColor='#ff3d6d';c.shadowBlur=8;c.fillRect(ex-4,ey-4,8,8);c.shadowBlur=0;
}
function showTitle(){
  closePop();if(G){G.state='title';G.placing=null;G.cutin=null}$('over').style.display='none';
  const p=loadProg(),box=$('stages');box.innerHTML='';
  STAGES.forEach((S,i)=>{const n=i+1,lock=n>p.un&&location.hash!=='#debug';
    const el=document.createElement('div');el.className='stg'+(lock?' lock':'');
    const pc=document.createElement('canvas');pc.width=96;pc.height=139;drawPreview(pc.getContext('2d'),S);el.appendChild(pc);
    el.insertAdjacentHTML('beforeend',`<div class="info"><div class="no">STAGE ${n}</div><div class="nm">${S.name}</div><div class="df">危険度 ${'★'.repeat(n)}${'☆'.repeat(5-n)}</div></div>${p.cl.includes(n)?'<span class="badge">CLEAR</span>':''}`);
    if(!lock)el.onclick=()=>{$('title').style.display='none';newGame(n);track('game_start',{stage:n})};
    box.appendChild(el)});
  $('title').style.display='flex';syncUI(true);
}
for(const b of $('spd').children)b.onclick=()=>{G.speed=+b.dataset.s;syncSpd()};
function syncSpd(){for(const b of $('spd').children)b.classList.toggle('on',+b.dataset.s===G.speed)}
$('pClose').onclick=closePop;
$('pUp').onclick=()=>{const t=G.sel;if(!t||t.lv>=3)return;const c=DEFS[t.type].up[t.lv-1];if(G.money<c)return;
  G.money-=c;t.spent+=c;t.lv++;burst(t.x,t.y,'#ffd23f',24,180);G.fx.push({k:'ring',x:t.x,y:t.y,r:10,to:56,life:.4,max:.4,col:'#ffd23f'});
  text(t.x,t.y-30,'LV UP!!','#ffd23f',20);refreshPop();syncUI(true)};
$('pSp').onclick=()=>{if(G.sel)special(G.sel)};
// 撤去（売却）：誤タップ防止のため、1回目で確認表示、2.5秒以内の2回目で確定
let sellArm=0;
$('pSell').onclick=()=>{const t=G.sel;if(!t)return;const v=Math.floor(t.spent*.6);
  if(performance.now()>sellArm){sellArm=performance.now()+2500;refreshPop();return}
  sellArm=0;G.money+=v;
  G.towers=G.towers.filter(o=>o!==t);text(t.x,t.y,'+'+v+'G','#ffd23f');burst(t.x,t.y,'#aaa',10);closePop();syncUI(true)};

function showOver(title,col,msg,b1,f1,b2,f2){
  $('oTitle').textContent=title;$('oTitle').style.color=col;$('oMsg').innerHTML=msg;
  $('oBtn1').textContent=b1;$('oBtn1').onclick=f1;
  $('oBtn2').style.display=b2?'':'none';if(b2){$('oBtn2').textContent=b2;$('oBtn2').onclick=f2}
  $('over').style.display='flex';
}
function openPop(t){hideUndo();sellArm=0;G.sel=t;G.placing=null;$('pop').style.display='block';refreshPop();placePop();syncUI(true)}
function closePop(){if(G)G.sel=null;$('pop').style.display='none'}
function placePop(){
  // 縦画面：タワーが下半分なら上端に、上半分なら下端にドック（タワーを隠さない）
  const t=G.sel;if(!t)return;const pop=$('pop'),top=t.y>H/2;
  pop.style.top=top?'6px':'auto';pop.style.bottom=top?'auto':'6px';
}
function refreshPop(){
  const t=G.sel;if(!t)return;const D=DEFS[t.type];
  $('pTitle').textContent=D.name;
  $('pLv').innerHTML=[1,2,3].map(i=>`<b class="${i<=t.lv?'on':''}"></b>`).join('')+`<span style="font-size:10px;color:#ffd23f;margin-left:4px">LV${t.lv}</span>`;
  const pi=$('pImg').getContext('2d'),pg=pi.createRadialGradient(88,60,4,88,70,120);
  pg.addColorStop(0,D.col);pg.addColorStop(1,'#0b0617');pi.fillStyle=pg;pi.fillRect(0,0,176,140);drawBust(pi,t.type,88,80,.8);
  const L=t.lv-1,N=Math.min(2,L+1),bar=(lab,f)=>`<span>${lab}</span><div class="bar"><s style="width:${Math.min(100,f(N)*100)}%"></s><u style="width:${Math.min(100,f(L)*100)}%"></u></div>`;
  $('pBars').innerHTML=bar('威力',l=>D.dmg[l]/320)+(D.rate?bar('速さ',l=>D.rate[l]/3.6):bar('減速',l=>D.slow[l]))+bar('射程',l=>D.range[l]/330);
  $('pRole').textContent=D.role;
  $('pStat').innerHTML=D.desc(t.lv)+(t.lv<3?`<br>→ LV${t.lv+1}: ${D.desc(t.lv+1)}`:'<br>★ MAX LEVEL ★')+`<br>必殺:『${D.sp}』CT${D.ct}秒`;
  const up=$('pUp');
  if(t.lv>=3){up.textContent='LV MAX';up.disabled=true}
  else{const c=D.up[t.lv-1];up.textContent=`LV UP（強化） ${c}G`;up.disabled=G.money<c}
  const sp=$('pSp');
  sp.textContent=t.spCd>0?`必殺技『${D.sp}』 CT ${Math.ceil(t.spCd)}s`:`必殺技『${D.sp}』発動！`;
  sp.disabled=t.spCd>0||!G.enemies.length;
  $('pCt').style.width=(100*(1-t.spCd/D.ct))+'%';
  const armed=performance.now()<sellArm;$('pSell').classList.toggle('armed',armed);
  $('pSell').textContent=armed?`⚠ もう一度タップで撤去（+${Math.floor(t.spent*.6)}G）`:`🗑️ 撤去（売却 +${Math.floor(t.spent*.6)}G）`;
}
let last={};
function syncUI(force){
  const m=Math.floor(G.money);
  if(force||last.m!==m){$('money').innerHTML=`呪力 <b>${m}</b>`;last.m=m;for(const k in cards)cards[k].classList.toggle('poor',m<DEFS[k].cost)}
  if(force||last.l!==G.life){$('life').innerHTML=`封印 <b>${G.life}</b>`;last.l=G.life}
  $('stage').innerHTML=`STAGE <b>${G.stage}</b>`;
  syncSp();
  $('wvN').textContent=G.wave;
  const segs=$('wgauge').children,prog=G.state==='wave'&&G.waveTotal?1-(G.queue.length+G.enemies.length)/G.waveTotal:1;
  for(let i=0;i<5;i++){const n=i+1,f=n<G.wave||(n===G.wave&&G.state!=='wave')?1:n===G.wave?Math.max(0,prog):0;
    segs[i].firstChild.style.width=(f*100)+'%';segs[i].classList.toggle('now',n===G.wave&&G.state==='wave')}

  const nd=G.state!=='ready'||G.wave>=5;$('next').disabled=nd;$('next').textContent=G.wave>=5?'WAVE開始 ▶':`WAVE ${G.wave+1} 開始 ▶`;
  for(const k in cards)cards[k].classList.toggle('sel',G.placing===k);
  const hint=$('hint');
  if(G.placing){hint.style.display='block';hint.textContent=`${DEFS[G.placing].name}：光っているマスをタップして配置`}else hint.style.display='none';
}
function endGame(win){
  if(G.state==='win'||G.state==='lose')return;
  G.state=win?'win':'lose';closePop();G.placing=null;G.winT=0;
  if(win){markClear(5);showOver('🎉 ALL CLEAR!!','#ffd23f',`全5ステージ・25WAVE突破！<br>呪いの王の厨房を制圧した！ 残りライフ ${G.life}`,'ステージ選択へ',showTitle)}
  else{track('game_over',{stage:G.stage,wave:G.wave});}
  if(!win)showOver('GAME OVER','#ff4d6d',`STAGE ${G.stage} - WAVE ${G.wave} で拠点が陥落…`,
    'このステージから再挑戦',()=>{G.money=G.stageMoney;startStage()},'ステージ選択',showTitle);

// ===== リサイズ =====
function fit(){
  const r=wrap.getBoundingClientRect();
  const s=Math.max(.1,Math.min((r.width-2)/W,(r.height-2)/H)); // 余白なしで横幅いっぱい
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  const nk=Math.max(1,Math.min(3,s*(window.devicePixelRatio||1))); // 高DPIでも鮮明に（最大3倍）
  if(nk!==K||!bg||cv.width!==Math.round(W*nk)){K=nk;cv.width=Math.round(W*K);cv.height=Math.round(H*K);buildBg()}
  if(G&&G.sel)placePop();
}
window.addEventListener('resize',fit);

// ===== ループ =====
let prev=performance.now(),uiT=0;
function loop(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  // カットイン中はスローモーション
  const sdt=dt*G.speed*(G.cutin&&G.cutin.el<1.5?.3:1);
  // 倍速でも判定が粗くならないよう 1/60 秒刻みで更新
  const live=()=>(G.state==='ready'||G.state==='wave')&&!G.paused;
  for(let rem=sdt;rem>1e-6&&live();rem-=1/60)update(Math.min(rem,1/60));
  updateFx(sdt,dt);
  draw();
  if(window.__post&&location.hash==='#debug')window.__post(ctx); // 検証用フック（#debug時のみ）
  uiT+=dt;if(uiT>.1){uiT=0;syncUI(false);if(G.sel)refreshPop()}
  requestAnimationFrame(loop);
}
newGame(1);fit();showTitle();
if(location.hash==='#debug')window.__td={get G(){return G},special,startStage,setupStage,update,makeWave,DEFS,ETYPES,HPM,BOSS_HP,BOSS_ARM,SPV,drawBust,drawUnit,drawCutHand,evilSky,drawEnemy,ETY:ETYPES,canPlace,get grid(){return grid},get PATH(){return PATH},next:()=>$('next').onclick()};
requestAnimationFrame(loop);
})();
