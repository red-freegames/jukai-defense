<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>呪界ディフェンス</title>
<meta name="theme-color" content="#030205">
<meta name="description" content="呪霊が押し寄せる呪界を、20人の術師から選んだ5人のデッキで守り抜け。漆黒とネオンのダークオカルト・タワーディフェンス。全30ステージ、クリアで新キャラ解放。必殺技のカットインで一掃せよ。スマホ縦画面対応。">
<meta property="og:title" content="呪界ディフェンス">
<meta property="og:description" content="20人の術師から5人のデッキを組み、呪霊の群れを迎え撃つダークオカルト・タワーディフェンス。全30ステージ、クリアで新キャラ解放。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://red-freegames.github.io/jukai-defense/">
<meta property="og:image" content="https://red-freegames.github.io/jukai-defense/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://red-freegames.github.io/jukai-defense/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800;1,900&family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   呪界ディフェンス UI
   漆黒ベース＋クリムゾン1色のアクセント。光らせすぎず、文字と余白で見せる
   ========================================================= */
:root{
  --bg:#0b0a0f;--s1:#13121a;--s2:#1b1a24;--s3:#252431;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.15);
  --tx:#f5f4f9;--tx2:#aeabbe;--tx3:#6f6c80;--acc:#ff2d55;--acc2:#ff6b86;--gold:#ffcf4a;--mint:#3ee08f;--cy:#4cc3ff;
  --f-jp:'Noto Sans JP',sans-serif;--f-en:'Barlow Condensed','Noto Sans JP',sans-serif;--f-logo:'Dela Gothic One','Noto Sans JP',sans-serif;
  --r:12px;--cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--f-jp);font-weight:500;overflow:hidden;touch-action:manipulation;-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center;align-items:center}
button{font:inherit;color:inherit}
#app{position:relative;display:flex;flex-direction:column;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
/* PCではスマホ型の枠に収める */
@media (min-width:600px){
  body{background:radial-gradient(ellipse at 50% 30%,#1a0d14,#060508 70%)}
  #app{width:min(480px,calc(min(100dvh,960px) * .5));height:min(calc(100dvh - 24px),960px);border-radius:28px;border:1px solid var(--ln2);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px #050407}
}
.en{font-family:var(--f-en)}

/* ---------- ボタン ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border:1px solid var(--ln2);border-radius:var(--r);cursor:pointer;white-space:nowrap;
  background:var(--s2);color:var(--tx);font:700 14px/1.2 var(--f-jp);letter-spacing:.02em;text-decoration:none;transition:transform .12s cubic-bezier(.3,1.5,.5,1),background .15s,opacity .15s}
.btn:disabled{opacity:.38;cursor:default}
.btn.red,#next:not(:disabled){border:none;border-radius:0;clip-path:var(--cut);background:linear-gradient(135deg,#ff4468,#e0123f);color:#fff;font-weight:900}
.btn.blue{background:var(--s2)}
.btn.press{transform:scale(.95)}
#next:disabled{background:var(--s1);color:var(--tx3)}
a.btn{text-align:center}

/* ---------- HUD（上部） ---------- */
#hud{flex:none;display:flex;align-items:center;gap:0;padding:8px 10px 8px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--ln)}
#hud .title{font-family:var(--f-logo);font-size:17px;line-height:1;margin-right:6px;color:#fff;text-align:center;white-space:nowrap}
#hud .title small{display:block;font-family:var(--f-en);font-weight:800;font-style:italic;font-size:9px;letter-spacing:.12em;color:var(--acc);margin-top:3px}
.stat{display:flex;flex-direction:column;gap:1px;padding:0 9px;border-left:1px solid var(--ln);font:600 10px/1 var(--f-en);letter-spacing:.1em;color:var(--tx3);text-transform:uppercase;white-space:nowrap}
.stat b{font:700 20px/1 var(--f-en);letter-spacing:.01em;color:var(--tx)}
#money b{color:var(--gold)}
#life b{color:var(--acc)}
.stat.wg span{display:block}
.gauge{display:flex;gap:2px;margin-top:4px}
.gauge i{display:block;width:11px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.gauge i u{display:block;height:100%;width:0;background:var(--tx);transition:width .2s}
.gauge i.boss u{background:var(--acc)}
.gauge i.now{box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.homebtn{flex:none;margin-left:auto;min-height:38px;padding:0 12px;border:1px solid var(--ln2);border-radius:10px;background:var(--s2);color:var(--tx);font:700 12px var(--f-en);letter-spacing:.08em;cursor:pointer;white-space:nowrap}
.homebtn.press{transform:scale(.93)}

/* ---------- 盤面 ---------- */
#wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:0}
canvas#cv{display:block;touch-action:none;background:#000}
@media (min-width:600px){#wrap{padding:6px}canvas#cv{border-radius:10px}}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:none;z-index:4;max-width:92%;padding:8px 14px;border-radius:999px;pointer-events:none;
  background:rgba(12,11,17,.9);border:1px solid var(--ln2);font:700 12px/1.4 var(--f-jp);color:var(--tx);text-align:center;white-space:normal;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#undo{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none;z-index:6;min-height:46px;background:rgba(27,26,36,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#undo.press{transform:translateX(-50%) scale(.95)}

/* ---------- 下部ドック：出撃キャラ＋操作 ---------- */
#dock{flex:none;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--s1);border-top:1px solid var(--ln)}
#panel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card{position:relative;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--s2);border:1px solid var(--ln);transition:transform .14s cubic-bezier(.3,1.5,.5,1)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rc,#888);z-index:2}
.card canvas{display:block;flex:none;width:100%;height:auto;aspect-ratio:1}
.card>div{position:absolute;left:0;right:0;top:0;aspect-ratio:1;pointer-events:none}
.card .nm{display:none}
.card .cs{position:absolute;left:0;right:0;bottom:0;padding:10px 5px 3px;font:700 15px/1 var(--f-en);color:var(--gold);background:linear-gradient(transparent,rgba(8,7,12,.9))}
.card .tg{position:absolute;top:6px;right:4px;font:700 9px/1 var(--f-jp);padding:3px 4px;border-radius:4px;color:#0b0a0f}
.card.sel{border-color:#fff;box-shadow:0 0 0 1px #fff;transform:translateY(-3px)}
.card.poor canvas{filter:grayscale(.85) brightness(.55)}
.card.poor .cs{color:var(--tx3)}
.card.press{transform:scale(.93)}
#ctrl{display:flex;gap:6px;margin-top:8px;align-items:stretch}
.spdseg{display:flex;flex:none;border-radius:var(--r);overflow:hidden;background:var(--s2);border:1px solid var(--ln2)}
.spdseg button{min-width:40px;min-height:48px;border:none;background:none;color:var(--tx3);font:700 15px var(--f-en);cursor:pointer}
.spdseg button+button{border-left:1px solid var(--ln)}
.spdseg button.on{background:var(--tx);color:var(--bg)}
.spdseg button[data-s="4"].on{background:var(--acc);color:#fff}
.spdseg button.press{filter:brightness(1.4)}
.tgl{position:relative;flex:none;width:50px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:var(--r);border:1px solid var(--ln2);
  background:var(--s2);color:var(--tx3);font:700 9px/1 var(--f-jp);cursor:pointer;transition:transform .12s}
.tgl b{font:700 12px/1 var(--f-en);letter-spacing:.06em}
.tgl b.jp{font-family:var(--f-jp);font-size:11px}
.tgl i{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#3a3848}
.tgl.on{background:rgba(76,195,255,.14);border-color:rgba(76,195,255,.6);color:#d9f3ff}
.tgl.on i{background:var(--cy)}
.tgl.up.on{background:rgba(255,207,74,.12);border-color:rgba(255,207,74,.6);color:#fff3cf}
.tgl.up.on i{background:var(--gold)}
.tgl.press{transform:scale(.92)}
#ctrl #next,#ctrl #cancelPlace{flex:1;min-width:0;padding:0 8px;font-size:15px}
#cancelPlace{display:none}

/* ---------- 強化パネル（ボトムシート） ---------- */
#pop{position:absolute;left:8px;right:8px;bottom:8px;top:auto;display:none;z-index:5;padding:14px;border-radius:18px;max-height:calc(100% - 12px);overflow-y:auto;
  background:linear-gradient(160deg,rgba(40,36,58,.78),rgba(14,13,20,.86));border:1px solid color-mix(in srgb,var(--rc,#fff) 55%,transparent);
  box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 18px color-mix(in srgb,var(--rc,#fff) 28%,transparent),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
#pop .now{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);margin-bottom:6px;font-size:11.5px;font-weight:700}
#pop .now span{white-space:nowrap}#pop .now em{font-style:normal;color:#7fe0ff;font-size:10.5px;margin-left:3px}
#pop .spi{margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,45,85,.35);background:rgba(255,45,85,.08);font-size:11.5px;line-height:1.55;color:#f3dbe1}
#pop .btn.sp{border:1px solid rgba(255,45,85,.5);background:rgba(255,45,85,.12);color:#ffb3c2;font-weight:900}
#pop .btn.sp.ready{border-color:var(--acc);background:var(--acc);color:#fff;box-shadow:0 0 18px rgba(255,45,85,.55);animation:spGlow 1.2s ease-in-out infinite}
#pop .btn.sp:disabled{opacity:.75;cursor:default}
@keyframes spGlow{50%{background:#ff5878;box-shadow:0 0 26px rgba(255,45,85,.8)}}
#pop .spi b{color:var(--acc2)}#pop .spi small{display:block;color:var(--tx2);font-size:10.5px;margin-top:2px}
/* キャラ詳細モーダル（デッキ編成・図鑑） */
#cm{position:absolute;inset:0;z-index:13;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,4,8,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#cm.show{display:flex;animation:cmIn .18s ease-out}
@keyframes cmIn{from{opacity:0}}
#cm .cmc{position:relative;width:100%;max-width:380px;max-height:100%;overflow-y:auto;border-radius:22px;padding:0 0 14px;
  background:linear-gradient(165deg,rgba(40,36,58,.94),rgba(13,12,19,.97));border:1px solid color-mix(in srgb,var(--rc) 60%,transparent);
  box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 0 26px color-mix(in srgb,var(--rc) 35%,transparent),0 24px 70px rgba(0,0,0,.7);animation:cmPop .22s cubic-bezier(.3,1.4,.5,1)}
@keyframes cmPop{from{transform:scale(.92) translateY(10px)}}
#cm .art{position:relative;border-radius:22px 22px 0 0;overflow:hidden}
#cm .art canvas{display:block;width:100%;height:auto;aspect-ratio:380/230}
#cm .art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc);box-shadow:0 0 12px var(--rc)}
#cm .x{position:absolute;right:6px;top:6px;z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid var(--ln2);background:rgba(10,9,14,.55);color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(6px)}
#cm .bd{padding:12px 16px 0}
#cm .nm{font:900 19px/1.3 var(--f-jp);margin-bottom:6px}
#cm .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
#cm .rl{margin-top:8px;font-size:12.5px;line-height:1.6;color:var(--tx)}
#cm h4{margin:12px 0 6px;font:italic 800 11px/1 var(--f-en);letter-spacing:.14em;color:var(--tx3)}
#cm .lv{display:grid;gap:4px;font-size:11.5px;line-height:1.5;color:var(--tx2)}
#cm .lv b{color:var(--gold);font-family:var(--f-en);margin-right:6px}
#cm .sp{padding:9px 11px;border-radius:12px;border:1px solid rgba(255,45,85,.4);background:rgba(255,45,85,.09);font-size:12px;line-height:1.6}
#cm .sp b{color:var(--acc2)}#cm .sp small{display:block;color:var(--tx2);font-size:11px}
#cm .ctr{display:flex;flex-wrap:wrap;gap:5px}
#cm .ctr span{font:700 11px/1 var(--f-jp);padding:5px 8px;border-radius:999px;background:rgba(62,224,143,.12);border:1px solid rgba(62,224,143,.35);color:#bff5d8}
#cm .lockm{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:12.5px;color:var(--tx2);text-align:center}
#cm .acts{display:flex;gap:8px;padding:14px 16px 0}
#cm .acts .btn{flex:1;white-space:normal;line-height:1.3;font-size:14px}
#cm .acts .btn.add{flex:1.6;border:none;background:var(--mint);color:#06210f;font-weight:900;box-shadow:0 0 16px rgba(62,224,143,.35)}
#cm .acts .btn.rm{flex:1.6;background:rgba(255,45,85,.16);border-color:rgba(255,45,85,.6);color:#ffd3dc;font-weight:900}
#cm .acts .btn:disabled{background:var(--s2);color:var(--tx3);box-shadow:none;border-color:var(--ln)}
/* 配置中のミニ情報 */
#hint.card-i{border-radius:14px;text-align:left;border-color:color-mix(in srgb,var(--rc,#fff) 55%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--rc,#fff) 25%,transparent)}
#hint .hn{font-weight:900}#hint .hs{display:block;font-weight:500;font-size:11px;color:var(--tx2)}
#pop .x{position:absolute;right:4px;top:4px;width:44px;height:44px;border:none;background:none;color:var(--tx2);font-size:24px;cursor:pointer;z-index:3}
#pop .phead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
#pop canvas{width:88px;height:70px;flex:none;border-radius:10px}
#pop .pt{font:900 16px/1.3 var(--f-jp);padding-right:40px}
#pop .lvp{display:flex;align-items:center;gap:3px;margin:6px 0 4px}
#pop .lvp b{width:18px;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
#pop .lvp b.on{background:var(--gold)}
#pop .lvp span{font:700 12px var(--f-en)!important;color:var(--gold)!important;margin-left:6px!important}
#pop .pr{font-size:11px;color:var(--tx2);line-height:1.4}
#pop .bars{display:grid;grid-template-columns:32px 1fr;gap:6px 10px;align-items:center;font-size:10.5px;font-weight:700;color:var(--tx2);margin-bottom:10px}
#pop .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
#pop .bar s{position:absolute;inset:0 auto 0 0;background:rgba(255,207,74,.3)}
#pop .bar u{position:absolute;inset:0 auto 0 0;background:var(--gold)}
#pop .ps{font-size:11.5px;line-height:1.65;color:#dcd9e6;padding:8px 10px;border-radius:10px;background:var(--s2);margin-bottom:6px}
#pop .ctbar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
#pop .ctbar div{height:100%;background:var(--acc)}
#pop .btn{display:flex;width:100%;margin-top:8px;min-height:48px;white-space:normal;line-height:1.3;font-size:14px}
#pop .btn.up{border:none;background:var(--mint);color:#06210f;font-weight:900}
#pop .btn.up:disabled{background:var(--s2);color:var(--tx3);opacity:1}
#pop .btn.sell{background:none;border-color:rgba(255,45,85,.4);color:var(--acc2)}
#pop .btn.sell.armed{background:var(--acc);border-color:var(--acc);color:#fff}
#pop .psep{height:1px;margin:12px 0 0;background:var(--ln)}

/* ---------- 結果画面 ---------- */
#over{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:stretch;justify-content:center;gap:12px;padding:24px 20px;text-align:center;
  background:rgba(8,7,11,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#over h1{font:italic 900 46px/1 var(--f-en);letter-spacing:.01em;text-transform:uppercase}
#over p{font-size:13.5px;line-height:1.8;color:#dcd9e6;padding:14px 16px;border-radius:14px;background:var(--s1);border:1px solid var(--ln)}
#over .row{display:flex;gap:8px}
#over .row .btn{flex:1}
#over .btn{min-height:52px}
#over .xshare{display:none;background:#fff;color:#000;border:none}
#over .unl{display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto auto;column-gap:12px;align-items:center;margin-top:12px;padding:10px;border-radius:12px;text-align:left;background:var(--s2);border:1px solid rgba(62,224,143,.45)}
#over .unl canvas{grid-row:1/4;width:64px;height:64px;border-radius:10px}
#over .unl small{font:italic 800 11px/1 var(--f-en);letter-spacing:.14em;color:var(--mint)}
#over .unl b{font:900 15px/1.3 var(--f-jp);color:#fff}
#over .unl .rb{justify-self:start}

/* ---------- タイトル／ステージ選択 ---------- */
#title{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;overflow-x:hidden;overflow-y:auto;background:var(--bg);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.hero{position:relative;flex:none;height:min(78vw,340px)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .logo{position:absolute;left:20px;right:20px;bottom:14px;line-height:1}
.logo .sub{font:italic 800 12px/1 var(--f-en);letter-spacing:.2em;color:var(--acc)}
.logo .l1{display:flex;align-items:baseline;gap:10px;margin-top:6px;font-family:var(--f-logo);font-size:64px;color:#fff;letter-spacing:.02em;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.logo .l2{font-family:var(--f-logo);font-size:22px;color:#fff;letter-spacing:.12em;margin-top:6px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.sec{padding:0 16px}
.sel-h{display:flex;align-items:baseline;justify-content:space-between;margin:18px 16px 10px;font:italic 800 14px var(--f-en);letter-spacing:.14em;color:var(--tx)}
.sel-h::before{content:"";width:3px;height:14px;background:var(--acc);margin-right:8px;align-self:center}
.sel-h span{margin-right:auto}
.sel-h b{font:700 13px var(--f-en);letter-spacing:.06em;color:var(--tx2)}
.sel-h b em{font-style:normal;color:var(--tx)}
#areaTabs{display:flex;margin:0 16px 12px;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--ln)}
.atab{flex:1;min-height:48px;border:none;border-radius:10px;background:none;color:var(--tx2);font:700 12.5px/1.25 var(--f-jp);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.atab small{font:700 10px/1 var(--f-en);letter-spacing:.14em;color:var(--tx3)}
.atab.on{background:var(--s3);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.atab.on small{color:var(--acc)}
.atab.lock{opacity:.45}
.atab.press{transform:scale(.95)}
#stages{display:flex;flex-direction:column;gap:8px;margin:0 16px}
.stg{position:relative;display:flex;align-items:center;gap:12px;min-height:76px;padding:10px 10px 10px 0;border-radius:14px;cursor:pointer;background:var(--s1);border:1px solid var(--ln);overflow:hidden;transition:transform .12s}
.stg .num{flex:none;width:58px;text-align:center;font:italic 800 30px/1 var(--f-en);color:var(--tx);letter-spacing:-.02em}
.stg .num small{display:block;font:700 9px/1 var(--f-en);font-style:normal;letter-spacing:.16em;color:var(--tx3);margin-bottom:3px}
.stg .info{flex:1;min-width:0}
.stg .nm{font:700 15px/1.3 var(--f-jp);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg .tr{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}

function setupStage(){

  segs=[];pathLen=0;
  for(let i=0;i<PATH.length-1;i++){
    const[ax,ay]=PATH[i],[bx,by]=PATH[i+1],len=Math.hypot(bx-ax,by-ay);
    segs.push({ax,ay,bx,by,len,start:pathLen});pathLen+=len;
  }
  // どのルートでも通過時間がほぼ同じになるよう、敵の速度・押し戻し量をルート長に比例させる。後半エリアほど速い
  G.spdK=(pathLen/CS)/56*AREA_SPD[S.area];

  for(let i=0;i<S.path.length-1;i++){
    let[c0,r0]=S.path[i];const[c1,r1]=S.path[i+1],dc=Math.sign(c1-c0),dr=Math.sign(r1-r0);
    for(;;){if(c0>=0&&c0<COLS&&r0>=0&&r0<ROWS)grid[r0][c0]=1;if(c0===c1&&r0===r1)break;c0+=dc;r0+=dr}
  }

  // 湧き口のまわりは置けない
  const sc0=Math.max(0,Math.min(COLS-1,S.path[0][0])),sr0=Math.max(0,Math.min(ROWS-1,S.path[0][1]));
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const r=sr0+dr,c=sc0+dc;if(r>=0&&r<ROWS&&c>=0&&c<COLS&&!grid[r][c])grid[r][c]=2}

}

function makeWave(st,wv){
  const S=STAGES[st-1],tr=S.tr,q=[],has=c=>tr.includes(c),base=Math.floor(6+2.6*wv+st*.45);
  const n={grunt:base,
    fast:(wv>=2||st>=2)?Math.floor(base*.3)+(has('F')?Math.floor(base*.45):0):0,
    tank:st>=2&&wv>=2?Math.floor((wv+st*.3)/2):0,
    armor:has('A')?Math.floor((wv*1.3+st*.22)/1.7):0,
    healer:has('H')?1+Math.floor((wv+st*.15)/2.5):0,
    ghost:has('G')?Math.floor((wv+2+st*.25)/1.1):0,
    splitter:has('P')?Math.floor((wv+1+st*.2)/1.8):0,
    golem:has('K')?Math.floor((wv*1.2+st*.1)/1.6):0,
    dasher:has('D')?2+Math.floor((wv*1.2+st*.15)/1.5):0,
    sniper:has('R')?1+Math.floor((wv+st*.12)/2.2):0,
    leech:has('M')?1+Math.floor((wv+st*.1)/2.2):0,
    hexer:has('X')?1+Math.floor((wv+st*.1)/2.5):0,
    jugger:has('J')&&wv>=2?Math.floor((wv+st*.08)/2.2):0};
  // 特徴のある種類を多めにして、ステージごとに必要な役割をはっきりさせる
  if(has('G'))n.grunt=Math.floor(n.grunt*.7);
  const gap={grunt:Math.max(.32,.9-.02*st-.03*wv),fast:.45,tank:1.2,armor:1.3,healer:1.4,ghost:.6,splitter:1.1,golem:1.8,dasher:.5,sniper:1.2,leech:.9,hexer:1.3,jugger:2.2};
  const pat=['grunt','fast','healer','grunt','tank','dasher','ghost','armor','sniper','splitter','grunt','leech','golem','hexer','dasher','jugger'];let i=0,left=()=>Object.values(n).reduce((a,b)=>a+b,0);
  while(left()>0){const t=pat[i++%pat.length];if(n[t]>0){n[t]--;q.push({t,gap:gap[t]})}}
  // 群れ：途中で一気に押し寄せる（範囲攻撃・範囲必殺の使いどころ）
  if((st>=3&&wv>=2)||(has('S')&&wv>=1)){const sw=[],m=Math.floor((has('S')?11:5)+st*.6+wv*2);for(let k=0;k<m;k++)sw.push({t:k%3?'fast':'grunt',gap:.13});
    sw[0].swarm=true;sw[sw.length-1].gap=1.5;q.splice(Math.floor(q.length*.5),0,...sw)}
  // 後半WAVEの総攻撃：最後に強敵が間を空けずに雪崩れ込む
  const hv=['tank',...(has('A')||st>=10?['armor']:[]),...(has('K')||st>=15?['golem']:[]),...(has('P')?['splitter']:[]),...(has('J')?['jugger']:[])];
  if(wv>=4){const k=Math.floor(1+st*.12+(wv-4)*2);
    for(let j=0;j<k;j++)q.push({t:hv[j%hv.length],gap:.55});
    for(let j=0;j<6+Math.floor(st*.5);j++)q.push({t:j%2?'fast':'grunt',gap:.16})}
  if(wv===5){
    q.push({t:'boss',gap:7});
    // ボスの後ろから時間差で強敵の波。必殺技1発（領域の停止）では全部を止められない
    // STAGE 6以降は2波目の先頭に副将（一級呪霊）が付く
    const waves=st>=24?3:st>=8?2:1;
    for(let w=0;w<waves;w++){if(w===1&&st>=6)q.push({t:'boss',sub:true,gap:1.2});
      for(let j=0;j<2+Math.floor(st*.08);j++)q.push({t:hv[(j+w)%hv.length],gap:.6});q[q.length-1].gap=7}
    if(waves===1&&st>=6)q.push({t:'boss',sub:true,gap:1});
  }
  return q;
}

      G.beams.push({x:t.x,y:t.y-10,a,len:900,w:26,life:.5,max:.5,col:D.col});
      for(const o of al)if(segDist(o.x,o.y,t.x,t.y,a,900)<26+o.r)hurt(o,v,true,D.col,true);shake(.7,12);break}
    case 'rain':for(let i=0;i<14;i++){const e=al[Math.random()*al.length|0];G.shots.push({x:t.x+(Math.random()-.5)*20,y:t.y-10,tg:e,dmg:v,col:D.col,sp:true,delay:i*.06})}shake(.3,5);break;
    case 'bleedAll':for(const e of al){e.dot=Math.max(e.dot,v);e.dotT=4;G.fx.push({k:'ring',x:e.x,y:e.y,r:4,to:22,life:.4,max:.4,col:D.col})}shake(.4,6);break;
    case 'heal':{const h=Math.min(10-G.life,v);G.life+=h;text(W/2,H-60,`封印 +${h}`,'#7fe0ff',24);G.fx.push({k:'nova',x:t.x,y:t.y,col:D.col,R:300,life:.7,max:.7});break}
    case 'jackpot':t.jackT=15;G.money+=v;text(t.x,t.y-40,`大当たり +${v}G`,'#5fffd0',18);burst(t.x,t.y,'#ffd23f',40,260);shake(.4,6);break;
    case 'goldRush':{G.money+=D.spv2[L-1];text(t.x,t.y-40,`+${D.spv2[L-1]}G`,'#ffd23f',20);
      for(const e of [...al].sort((a,b)=>b.hp-a.hp).slice(0,6)){hurt(e,v,true,D.col,true);G.fx.push({k:'zap',x0:t.x,y0:t.y-20,x1:e.x,y1:e.y,life:.3,max:.3})}shake(.3,5);break}
    case 'rika':{const c=crowdAt(al,120),R=150;
      for(const e of al)if(Math.hypot(e.x-c.x,e.y-c.y)<R+e.r){hurt(e,v,true,D.col,true);stunE(e,1.5)}
      G.fx.push({k:'nova',x:c.x,y:c.y,col:D.col,R:R*1.5,life:.6,max:.6},{k:'boom',x:c.x,y:c.y,life:.5,max:.5});burst(c.x,c.y,D.col,50,320);shake(1,15);break}
  }
  spAuto=false;
  // 手動は全画面カットイン。AUTOは画面左下の小テロップだけにして、ゲームのテンポを止めない
  if(auto){G.minis=G.minis.filter(m=>m.t>0).slice(-2);G.minis.push({type:t.type,txt:D.sp,rc:D.rc,t:1.4});G.fx.push({k:'nova',x:t.x,y:t.y,col:D.col,life:.5,max:.5})}
  else cutin(t.type,t.x,t.y);
  t.spCd=D.ct;
  // AUTO発動では開いている強化パネルを閉じない
  if(!auto)closePop();
}
// 点(px,py)と、(x,y)から角度aに伸びる長さlenの線分との距離
function segDist(px,py,x,y,a,len){const dx=Math.cos(a),dy=Math.sin(a),u=Math.max(0,Math.min(len,(px-x)*dx+(py-y)*dy));return Math.hypot(px-(x+dx*u),py-(y+dy*u))}

// ===== 必殺技AUTO／自動進化 =====
const AUTO={sp:false,up:false};
try{localStorage.removeItem('jkd_auto')}catch(e){} // 以前の保存値は使わない（ステージ開始時は常にOFF）
function saveAuto(){}
let autoT=0,autoGap=0;
function autoTick(dt){
  autoT-=dt;autoGap-=dt;if(autoT>0)return;autoT=.25;
  if(AUTO.up&&!G.placing)autoUpgrade();
  if(AUTO.sp&&G.state==='wave'&&!G.cutin&&autoGap<=0)autoSpecial();
}
const STRONG={boss:1,tank:1,armor:1,golem:1,jugger:1};
// 必殺の型ごとの「美味しいタイミング」
function wantSp(t,al,gojoReady){
  const D=DEFS[t.type],R=D.range[t.lv-1],prog=e=>e.d/pathLen,boss=al.find(e=>e.t==='boss'),
    lead=Math.max(...al.map(prog)),dom=domainOn(),inN=k=>al.filter(e=>inR(t,e,R*k)).length;
  // 拠点の目前まで来ているなら誰でも撃つ
  const danger=lead>.88;
  // ボスWAVEでボスがまだ出ていない間は、五条と宿儺の切り札を温存する
  const bossComing=!boss&&G.queue.some(q=>q.t==='boss');
  // 五条がもうすぐ撃てるなら、大技は停止に合わせて待つ
  const gojoSoon=gojoReady||G.towers.some(o=>DEFS[o.type].sk==='domain'&&o.spCd<8);
  switch(D.sk){
    case 'rush':case 'nuke':case 'beamNuke':  // 強敵・ボスが近くに来た時（停止中ならダメージ増で最優先）
      if(boss&&gojoReady&&!dom)return false;
      return al.some(e=>STRONG[e.t]&&inR(t,e,R*1.8))||(dom&&!!boss)||(D.sk!=='rush'&&!!boss)||inN(1.2)>=5||danger;
    case 'push':  // 群れている時、またはルート終盤まで押し込まれた時に押し戻す
      return inN(1.1)>=4||al.length>=9||lead>.75||(boss&&prog(boss)>.55);
    case 'bombs':case 'rain':return inN(1.5)>=3||(boss&&inR(t,boss,R*1.5))||al.length>=8||danger;
    case 'quake':case 'counter':case 'rika':case 'bleedAll':case 'goldRush':
      return inN(1.4)>=4||al.length>=9||(boss&&inR(t,boss,R*1.6))||danger;
    case 'stunAll':if(dom)return false;return (boss&&prog(boss)>.3)||al.length>=12||lead>.75;
    case 'buffAll':case 'hasteAll':case 'jackpot':return G.towers.length>=3&&(!!boss||al.length>=10||danger);
    case 'heal':return G.life<=7;
    case 'domain':  // 領域：ボスがルートに乗った時、または大群・終盤の危機
      if(dom)return false;
      if(bossComing)return lead>.75;
      return (boss&&prog(boss)>.15)||al.length>=10||(lead>.7&&al.length>=4);
    case 'kitchen':  // 停止中の追撃が最も効く。ボス戦では五条を待つ
      if(G.kitchen>0)return false;
      if(dom)return true;
      if(bossComing)return lead>.8;
      if(boss)return !gojoSoon||prog(boss)>.7;
      return al.length>=8||lead>.75;
  }
  return false;
}
function autoSpecial(){
  const al=alive();
  const ord={domain:0,stunAll:1,buffAll:2,hasteAll:3,kitchen:4,rika:5,jackpot:6};
  const ready=G.towers.filter(t=>t.spCd<=0).sort((a,b)=>(ord[DEFS[a.type].sk]??9)-(ord[DEFS[b.type].sk]??9)||b.lv-a.lv);
  if(!al.length){const h=ready.find(t=>DEFS[t.type].sk==='heal'&&G.life<=7);if(h){special(h,true);autoGap=1}return}
  const gojoReady=ready.some(t=>DEFS[t.type].sk==='domain');
  // 1回に1体だけ。カットインが重ならないよう少し間を空ける
  for(const t of ready)if(wantSp(t,al,gojoReady)){special(t,true);autoGap=1;return}
}
// 自動進化：コストの高いキャラから、同じなら配置順に。置き直し猶予中のキャラは除く
// 自動進化は手数料つき（強化費の1.5倍）。任せきりにすると呪力が枯れる
const AUTO_FEE=1.5,CARRY_MAX=.2;
const upCost=(t,auto)=>r10c(upOf(t.type,t.lv)*(auto?AUTO_FEE:1));
function upgrade(t,auto){const c=upCost(t,auto);if(t.lv>=3||G.money<c)return false;
  G.money-=c;t.spent+=c;t.lv++;burst(t.x,t.y,'#ffd23f',24,180);G.fx.push({k:'ring',x:t.x,y:t.y,r:10,to:56,life:.4,max:.4,col:'#ffd23f'});
  text(t.x,t.y-30,'LV UP!!','#ffd23f',20);if(G.sel===t)refreshPop();return true}
function autoUpgrade(){
  if(G.state!=='ready'&&G.state!=='wave')return;
  const c=G.towers.map((t,i)=>({t,i})).filter(o=>o.t.lv<3&&o.t!==G.undoT).sort((a,b)=>DEFS[b.t.type].cost-DEFS[a.t.type].cost||a.i-b.i);
  for(const o of c)if(upgrade(o.t,true)){syncUI(true);return}
}
function syncAuto(){for(const[id,k]of[['autoSp','sp'],['autoUp','up']]){const b=$(id);b.classList.toggle('on',AUTO[k]);b.setAttribute('aria-pressed',AUTO[k])}}

// ===== 更新 =====
const inR=(t,e,r)=>(e.x-t.x)**2+(e.y-t.y)**2<=(r+e.r)**2;
function update(dt){
  G.time+=dt;
  autoTick(dt);
  if(G.winT>0){G.winT-=dt;if(G.winT<=0){endGame(true);return}}
  if(G.state==='wave'){
    G.incomeT+=dt;if(G.incomeT>=1){G.incomeT-=1;G.money+=2+incomeBonus()}
    if(G.queue.length){G.spawnT-=dt;if(G.spawnT<=0){const it=G.queue.shift();spawn(it.t,it.swarm,0,it);G.spawnT=it.gap}}
  }
  if(G.warn>0)G.warn-=dt;
  if(G.buffAll>0)G.buffAll-=dt;if(G.hasteAll>0)G.hasteAll-=dt;
  const domOn=domainOn();
  if(G.domain>0){G.domain-=dt;if(domOn)for(const e of G.enemies){hurt(e,G.domainLv*dt,false,null,true);
    if(Math.random()<dt*.3)text(e.x,e.y-e.r-10,'ぐぅ〜','#9ad8ff',12)}}
  if(G.kitchen>0){G.kitchen-=dt;if(G.kitchen<4){for(const e of G.enemies)hurt(e,G.kitchenLv*dt,false,null,true);
    if(Math.random()<dt*25){const es=alive();if(es.length){const e=es[Math.random()*es.length|0];G.fx.push({k:'cut',x:e.x,y:e.y,a:Math.random()*3.14,len:70,life:.2,max:.2})}}
    if(Math.random()<dt*8)shake(.1,4);
    if(Math.random()<dt*3)G.fx.push({k:'cut',x:Math.random()*W,y:Math.random()*H,a:Math.random()*3.14,len:240,life:.28,max:.28})}}

  towerMods();
  for(const t of G.towers){
    const D=DEFS[t.type],L=t.lv-1,R=D.range[L];
    t.cd=Math.max(0,t.cd-dt);t.spCd=Math.max(0,t.spCd-dt);t.anim=Math.max(0,t.anim-dt);
    if(t.jackT>0)t.jackT-=dt;if(t.hexT>0)t.hexT-=dt;
    // 呪縛弾・狙撃で封じられている間は何もしない
    if(t.stunT>0){t.stunT-=dt;t.active=false;continue}
    const dmg=D.dmg?D.dmg[L]*t.mD:0,rate=D.rate?D.rate[L]*t.mR:0;
    if(D.atk==='regen'){if(G.state==='wave'){t.regT=(t.regT||0)+dt;if(t.regT>=D.regen[L]){t.regT=0;if(G.life<10){G.life++;text(t.x,t.y-34,'封印 +1','#7fe0ff',14);G.fx.push({k:'ring',x:t.x,y:t.y,r:6,to:40,life:.5,max:.5,col:D.col})}}}continue}
    if(D.atk==='aura')continue;
    if(D.atk==='field'){let any=false;
      for(const e of G.enemies)if(!e.dead&&inR(t,e,R)){hurt(e,dmg*dt,false);e.slow=Math.max(e.slow,D.slow[L]*(e.t==='boss'||e.heavy?.5:1));any=true;if(Math.random()<dt*2.5)G.fx.push({k:'zap',x0:t.x,y0:t.y-20,x1:e.x,y1:e.y,life:.15,max:.15});
        if(Math.random()<dt*5)G.parts.push({x:e.x,y:e.y,vx:0,vy:-30,life:.4,col:'#9ad8ff',sz:3})}
      t.active=any;continue}
    if(t.cd>0)continue;
    let front=null;
    for(const e of G.enemies)if(!e.dead&&inR(t,e,R)&&(!front||e.d>front.d))front=e;
    if(!front)continue;
    t.cd=1/rate;t.face=front.x<t.x?-1:1;
    switch(D.atk){
      case 'melee':case 'pierce':{t.anim=.12;
        const big=D.jack&&Math.random()<D.jack;if(big){t.jackT=Math.max(t.jackT||0,8);text(t.x,t.y-40,'大当たり！','#5fffd0',16)}
        if(hitOne(t,front,dmg,D.atk==='pierce'?D.col:null,D.atk==='pierce')){
          if(D.slow){front.slowT=1;front.slowV=D.slow[L]}}
        G.fx.push({k:D.atk==='pierce'?'cut':'punch',x:front.x,y:front.y,a:Math.random()*3,len:40,life:.15,max:.15,lv:t.lv,col:D.atk==='pierce'?D.col:null});
        if(Math.random()<.4)burst(front.x,front.y,D.col,3,80);break}
      case 'splash':{t.anim=.25;const A=D.aoe;
        G.fx.push({k:'claw',x:front.x,y:front.y,life:.25,max:.25,col:D.col});
        if(t.type==='megumi')G.fx.push({k:'dog',x0:t.x,y0:t.y,x1:front.x,y1:front.y,life:.25,max:.25});
        for(const e of G.enemies)if(!e.dead&&Math.hypot(e.x-front.x,e.y-front.y)<A+e.r){hurt(e,dmg*aoeK(e),e===front);
          // 押し戻しは一度当たると0.8秒は効かない（複数配置でのハメ防止）。重い敵は半減、重戦車には効かない
          if(D.push&&e.t!=='boss'&&!e.heavy&&!(e.kbT>G.time)){e.kbT=G.time+.8;e.d=Math.max(0,e.d-D.push[L]*G.spdK*(e.t==='tank'||e.t==='armor'||e.t==='golem'?.5:1));const p=posAt(e.d);e.x=p.x;e.y=p.y}}
        G.fx.push({k:'ring',x:front.x,y:front.y,r:8,to:A,life:.25,max:.25,col:D.col});break}
      case 'snipe':case 'dot':t.anim=.2;G.shots.push({x:t.x+6*t.face,y:t.y-8,tg:front,dmg,col:D.col,tw:t,dot:D.dot?D.dot[L]*t.mD:0});break;
      case 'beam':{t.anim=.25;const a=Math.atan2(front.y-t.y,front.x-t.x);
        G.beams.push({x:t.x,y:t.y-10,a,len:R,w:10,life:.25,max:.25,col:D.col});
        for(const e of G.enemies)if(!e.dead&&segDist(e.x,e.y,t.x,t.y,a,R)<10+e.r)hurt(e,dmg*aoeK(e),e===front,D.col,!!D.pierce);break}
      case 'cleave':{t.anim=.2;let n=0;
        for(const e of G.enemies)if(!e.dead&&inR(t,e,R)){hurt(e,dmg*aoeK(e),true,null);
          if(n++<6)G.fx.push({k:'cut',x:e.x,y:e.y,a:Math.random()*3.14,len:e.r*2+24,life:.18,max:.18})}
        G.fx.push({k:'claw',x:front.x,y:front.y,life:.3,max:.3,col:D.col});
        if(t.type==='sukuna'&&Math.random()<.1)text(t.x,t.y-50,['ケヒッ','ケヒヒ…','嗤'][Math.random()*3|0],'#ff2a3a',12);break}
      case 'stun':{t.anim=.35;for(const e of G.enemies)if(!e.dead&&inR(t,e,R)){hurt(e,dmg*aoeK(e),false);stunE(e,D.stun[L])}
        G.fx.push({k:'ring',x:t.x,y:t.y,r:10,to:R,life:.4,max:.4,col:D.col});text(t.x,t.y-44,'「止まれ」','#d8c8ff',12);break}
      case 'income':{t.anim=.2;let hit=0;const tg=[...G.enemies].filter(e=>!e.dead&&inR(t,e,R)).sort((a,b)=>b.d-a.d).slice(0,D.chain);
        for(const e of tg){hurt(e,dmg,hit++===0,D.col);G.fx.push({k:'zap',x0:t.x,y0:t.y-20,x1:e.x,y1:e.y,life:.18,max:.18})}break}
    }
  }

  for(const r of G.rushes){
    r.timer-=dt;
    if(r.timer<=0&&r.hits>0){
      if(r.tg.dead){const al=alive();if(!al.length){r.hits=0;continue}r.tg=strongest(al)}
      const e=r.tg;
      hurt(e,r.dmg*(r.hits===1?2:1),true,'#ff3030',true);
      G.fx.push({k:'bolt',x:e.x,y:e.y,life:.22,max:.22,seed:Math.random()*99});
      G.fx.push({k:'ring',x:e.x,y:e.y,r:10,to:70,life:.3,max:.3,col:'#ff2a2a'});
      burst(e.x,e.y,'#111',8,200);burst(e.x,e.y,'#ff2a2a',6,220);
      G.fx.push({k:'punch',x:e.x,y:e.y,life:.2,max:.2,col:'#ff2a2a'});if(r.hits===1)G.fx.push({k:'blackflash',x:e.x,y:e.y,seed:Math.random()*999,life:.35,max:.35});
      shake(.12,r.hits===1?12:5);r.t.anim=.1;r.t.face=e.x<r.t.x?-1:1;
      r.hits--;r.timer=.11;
    }
  }
  G.rushes=G.rushes.filter(r=>r.hits>0);

  for(const s of G.shots){
    if(s.delay>0){s.delay-=dt;continue}
    const tx=s.tg.x,ty=s.tg.y,dx=tx-s.x,dy=ty-s.y,dd=Math.hypot(dx,dy),st=900*dt,col=s.col||'#ffb36b';
    if(dd<=st||s.tg.dead){if(!s.tg.dead){
        const ok=s.sp?(hurt(s.tg,s.dmg,true,col,true),true):hitOne(s.tw,s.tg,s.dmg,col,false);
        if(ok&&s.dot){s.tg.dot=Math.max(s.tg.dot,s.dot);s.tg.dotT=3}
        burst(tx,ty,col,5,100);G.fx.push({k:'punch',x:tx,y:ty,life:.18,max:.18,col})}s.done=true}
    else{s.x+=dx/dd*st;s.y+=dy/dd*st;s.a=Math.atan2(dy,dx)}
  }
  G.shots=G.shots.filter(s=>!s.done);
  for(const b of G.beams)b.life-=dt;G.beams=G.beams.filter(b=>b.life>0);

  for(const b of G.bombs){
    if(!b.tg.dead){b.x=b.tg.x;b.y=b.tg.y}
    b.t-=dt;
    if(b.t<=0){b.done=true;
      for(const e of G.enemies)if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<60+e.r)hurt(e,b.dmg,true,'#ff8a3d',true);
      G.fx.push({k:'boom',x:b.x,y:b.y,life:.45,max:.45},{k:'nova',x:b.x,y:b.y,col:'#ff8a3d',R:110,life:.4,max:.4});burst(b.x,b.y,'#ff8a3d',22,260);burst(b.x,b.y,'#ffe66d',12,200);shake(.25,10)}
  }
  G.bombs=G.bombs.filter(b=>!b.done);

  const frozen=domOn;
  for(const e of G.enemies){
    if(e.dead)continue;
    e.flash=Math.max(0,e.flash-dt);
    // 出血（装甲を無視）
    if(e.dotT>0){e.dotT-=dt;hurt(e,e.dot*dt,false,null,true);if(e.dotT<=0)e.dot=0;if(e.dead)continue}
    // 回復役：周囲の仲間を癒す（ボスには少しだけ）
    if(e.heal&&!frozen&&!(e.stunT>0)){e.hT=(e.hT||0)+dt;if(e.hT>=1){e.hT=0;
      for(const o of G.enemies)if(!o.dead&&o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<75){o.hp=Math.min(o.maxHp,o.hp+o.maxHp*e.heal*(o.t==='boss'?.12:1))}
      G.fx.push({k:'ring',x:e.x,y:e.y,r:6,to:75,life:.5,max:.5,col:'#5fffb0'})}}
    if(e.t==='boss'&&!frozen)bossAbility(e,dt);
    if(!frozen&&!(e.stunT>0))enemyAbility(e,dt);
    if(e.slowT>0){e.slowT-=dt;e.slow=Math.max(e.slow,(e.slowV||.4)*(e.t==='boss'||e.heavy?.5:1))}
    const held=frozen||e.stunT>0;if(e.stunT>0)e.stunT-=dt;
    // 無量空腹中・スタン中は完全停止。突進中は減速を振り切る
    e.d+=held?0:e.dashT>0?e.spd*DASH_SPD*dt:e.spd*(1-Math.min(.85,e.slow))*dt;
    e.slow=0;
    const p=posAt(e.d);e.x=p.x;e.y=p.y;
    if(e.d>=pathLen){
      e.dead=true;const dmg=e.lk;G.life=Math.max(0,G.life-dmg);
      shake(.3,8);text(p.x,p.y-30,'-'+dmg+'♥','#ff4d6d',22);burst(p.x,p.y,'#ff4d6d',15);
      if(G.life<=0){endGame(false);return}
    }
  }
  G.enemies=G.enemies.filter(e=>!e.dead);

  if(G.state==='wave'&&!G.queue.length&&!G.enemies.length&&G.winT<=0){
    // WAVE4 クリア時はボス戦に備えた準備金を上乗せ
    const bonus=35+10*G.stage+8*G.wave+(G.wave===4?45*G.stage:0);G.money+=bonus;
    if(G.wave>=5){
      if(G.stage>=LAST){endGame(true);return}
      stageClear(bonus);
    }else{G.state='ready';G.banner={text:G.wave===4?`ボス戦準備金 +${bonus}G`:`WAVE ${G.wave} CLEAR!  +${bonus}G`,t:2,col:'#ffd23f'}}
    syncUI(true);
  }

const hexA=(h,a)=>`rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${a})`;

    c.beginPath();c.moveTo(x,y+k);c.lineTo(x,y);c.lineTo(x+k,y);c.moveTo(x+s-k,y);c.lineTo(x+s,y);c.lineTo(x+s,y+k);c.moveTo(x+s,y+s-k);c.lineTo(x+s,y+s);c.lineTo(x+s-k,y+s);c.moveTo(x+k,y+s);c.lineTo(x,y+s);c.lineTo(x,y+s-k);c.stroke()}
  // 小物：御札・蝋燭・墓石
  for(let i=0;i<30;i++){const col=rnd()*COLS|0,row=rnd()*ROWS|0;if(grid[row][col]===1)continue;const x=col*CS+6+rnd()*28,y=row*CS+8+rnd()*24,k=rnd();

    else if(k<.7){c.fillStyle='rgba(30,25,35,.9)';c.fillRect(x-4,y-8,8,12);c.beginPath();c.arc(x,y-8,4,Math.PI,0);c.fill();c.strokeStyle='rgba(0,0,0,.8)';c.beginPath();c.moveTo(x-1,y-9);c.lineTo(x+1,y-2);c.stroke()}
    else{const cg=c.createRadialGradient(x,y-6,0,x,y-6,12);cg.addColorStop(0,'rgba(255,190,90,.45)');cg.addColorStop(1,'rgba(255,120,40,0)');c.fillStyle=cg;c.fillRect(x-12,y-18,24,24);
      c.fillStyle='#d8cfc0';c.fillRect(x-2,y-4,4,7);c.fillStyle='#ffd27a';c.beginPath();c.ellipse(x,y-6,1.4,2.6,0,0,7);c.fill()}}
  if(th.snow){c.fillStyle='rgba(230,240,255,.5)';for(let i=0;i<220;i++)c.fillRect(rnd()*W,rnd()*H,1.5,1.5)}
  // 通路：漆黒の溝に、両縁が発光するライン
  const line=(w,col,blur)=>{c.save();c.lineWidth=w;c.strokeStyle=col;c.lineJoin='miter';c.lineCap='butt';if(blur){c.shadowColor=col;c.shadowBlur=blur}
    c.beginPath();PATH.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();c.restore()};
  line(CS+16,'rgba(0,0,0,.75)');line(CS+5,th.edge,20);line(CS+1,th.edge);line(CS-3,th.floor);
  line(CS-3,hexA(th.acc,.10));line(CS-12,hexA(th.edge,.05));line(CS-11,hexA(th.edge,.22));line(CS-13,th.floor);line(CS-13,hexA(th.acc,.08));
  // 通路に刻まれた呪印
  for(let d=30;d<pathLen;d+=120){const p=posAt(d);sigil(c,p.x,p.y,10,th.edge,.12,d*.1,5)}
}

// 通路の進行方向（毎フレーム）：中央のガイド線と、拠点へ流れる矢印
function drawPathFlow(){
  const th=STAGES[G.stage-1].th,pl=()=>{ctx.beginPath();PATH.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y))};
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  // 光の波が通路を走る
  ctx.setLineDash([70,520]);ctx.lineDashOffset=-G.time*200;pl();ctx.strokeStyle=hexA(th.edge,.13);ctx.lineWidth=CS-8;ctx.stroke();
  ctx.setLineDash([]);pl();ctx.strokeStyle=hexA(th.edge,.16);ctx.lineWidth=1.5;ctx.stroke();
  // 矢印
  const gap=38,off=(G.time*42)%gap;ctx.strokeStyle=hexA(th.edge,.7);ctx.lineWidth=2.2;ctx.shadowColor=th.edge;ctx.shadowBlur=6;ctx.beginPath();
  for(let d=off+24;d<pathLen-34;d+=gap){const p=posAt(d),q=posAt(d+2),a=Math.atan2(q.y-p.y,q.x-p.x),ca=Math.cos(a),sa=Math.sin(a),s=5;
    ctx.moveTo(p.x-ca*s-sa*s*1.1,p.y-sa*s+ca*s*1.1);ctx.lineTo(p.x+ca*s*.7,p.y+sa*s*.7);ctx.lineTo(p.x-ca*s+sa*s*1.1,p.y-sa*s-ca*s*1.1)}

}

  const skin=lgr(c,-60,10,B.skin,'#c99a80');

  const glow=(cx,cy,r,col,a=1)=>{c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,hexA(col,.9*a));g.addColorStop(.4,hexA(col,.35*a));g.addColorStop(1,hexA(col,0));c.fillStyle=g;c.fillRect(cx-r,cy-r,r*2,r*2);c.restore()};

const towerAt=(c,r)=>G.towers.find(t=>t.c===c&&t.r===r);

function toCell(ev){const rc=cv.getBoundingClientRect(),x=(ev.clientX-rc.left)/rc.width*W,y=(ev.clientY-rc.top)/rc.height*H;return{x,y,c:Math.floor(x/CS),r:Math.floor(y/CS)}}

// キャラのタップ判定：足元のマスだけでなく頭まで含めた広い範囲で、指に一番近いキャラを選ぶ
function towerHit(x,y){let best=null,bd=1e9;
  for(const t of G.towers){const dx=x-t.x,dy=y-(t.y-10);if(Math.abs(dx)<=26&&dy>=-40&&dy<=32){const d=dx*dx+dy*dy;if(d<bd){bd=d;best=t}}}
  return best}
// 置けないマスをタップしても、指から近い（34px以内）置けるマスに吸着させる
function snapCell(h){if(canPlace(h.c,h.r))return{c:h.c,r:h.r};let best=null,bd=34*34;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const c=h.c+dc,r=h.r+dr;if(!canPlace(c,r))continue;
    const d=(c*CS+CS/2-h.x)**2+(r*CS+CS/2-h.y)**2;if(d<bd){bd=d;best={c,r}}}
  return best}
// 置いた直後の3秒だけ「置き直す（全額返金）」を出す。指の誤タップ対策
let undoTimer=0;
function showUndo(t){G.undoT=t;$('undo').style.display='block';clearTimeout(undoTimer);undoTimer=setTimeout(hideUndo,3000)}
function hideUndo(){if(G)G.undoT=null;$('undo').style.display='none'}
cv.addEventListener('pointerdown',ev=>{
  // カットイン中のタップはスキップ（退場アニメへ飛ばす。スローモーションもここで解ける）
  if(G.cutin){const c=G.cutin;if(c.el<c.max-.28)c.el=c.max-.28;return}
  if(G.state!=='ready'&&G.state!=='wave')return;
  const h=toCell(ev);G.hover=h;
  if(G.placing){
    const D=DEFS[G.placing],cost=costOf(G.placing);
    if(G.money<cost){text(h.x,h.y,'マネー不足！','#ff4d6d');return}
    const s=snapCell(h);
    if(!s){text(h.x,h.y,towerHit(h.x,h.y)?'もう誰かいる！':'そこには置けない！','#ff4d6d');return}
    G.money-=cost;const x=s.c*CS+CS/2,y=s.r*CS+CS/2;
    const t={type:G.placing,c:s.c,r:s.r,x,y,lv:1,cd:0,spCd:D.ct*.3,anim:0,face:1,spent:cost};G.towers.push(t);
    burst(x,y,'#fff',14);G.fx.push({k:'ring',x,y,r:5,to:36,life:.3,max:.3,col:'#fff'});
    showUndo(t);
    if(!ev.shiftKey)G.placing=null;

});

  ln(CS*k+2,S.th.edge);ln(CS*k-1,S.th.floor);

  for(const u of $('oMsg').querySelectorAll('.unl'))u.prepend(charIcon(u.dataset.k,64,64));
}
for(const b of $('spd').children)b.onclick=()=>{G.speed=+b.dataset.s;syncSpd()};
function syncSpd(){for(const b of $('spd').children)b.classList.toggle('on',+b.dataset.s===G.speed)}
$('pClose').onclick=closePop;
$('pUp').onclick=()=>{const t=G.sel;if(t&&upgrade(t)){refreshPop();syncUI(true)}};
$('autoSp').onclick=()=>{AUTO.sp=!AUTO.sp;saveAuto();syncAuto();if(G&&G.sel)refreshPop();track('auto_toggle',{kind:'special',on:AUTO.sp})};
$('autoUp').onclick=()=>{AUTO.up=!AUTO.up;saveAuto();syncAuto();track('auto_toggle',{kind:'upgrade',on:AUTO.up})};
syncAuto();
// 強化パネル内の必殺ボタン：そのキャラの必殺技を手動で撃つ（全画面カットイン）
$('pSp').onclick=()=>{const t=G.sel;if(t&&t.spCd<=0)special(t)};
// 撤去（売却）：誤タップ防止のため、1回目で確認表示、2.5秒以内の2回目で確定
let sellArm=0;
$('pSell').onclick=()=>{const t=G.sel;if(!t)return;const v=Math.floor(t.spent*.6);
  if(performance.now()>sellArm){sellArm=performance.now()+2500;refreshPop();return}
  sellArm=0;G.money+=v;
  G.towers=G.towers.filter(o=>o!==t);text(t.x,t.y,'+'+v+'G','#ffd23f');burst(t.x,t.y,'#aaa',10);closePop();syncUI(true)};

function showOver(title,col,msg,b1,f1,b2,f2,share){
  $('oTitle').textContent=title;$('oTitle').style.color=col;$('oMsg').innerHTML=msg;
  $('oBtn1').textContent=b1;$('oBtn1').onclick=f1;
  $('oBtn2').style.display=b2?'':'none';if(b2){$('oBtn2').textContent=b2;$('oBtn2').onclick=f2}
  // クリア時だけXシェアを出す（本文・ハッシュタグ・URL入り）
  const sh=$('oShare');sh.style.display=share?'flex':'none';
  if(share){sh.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(share)+'&url='+encodeURIComponent('https://red-freegames.github.io/jukai-defense/');
    sh.onclick=()=>track('share',{stage:G.stage,all:G.state==='win'})}
  $('over').style.display='flex';
}
const shareText=(head,life)=>`『呪界ディフェンス』${head}\n残り封印 ${life}/10 ⚔️ 呪霊の群れを術師5人で迎え撃つ無料ブラウザゲーム\n#呪界ディフェンス #REDFREEGAMES`;
function openPop(t){hideUndo();sellArm=0;G.sel=t;G.placing=null;$('pop').style.display='block';refreshPop();placePop();syncUI(true)}
function closePop(){if(G)G.sel=null;$('pop').style.display='none'}
function placePop(){
  // 縦画面：タワーが下半分なら上端に、上半分なら下端にドック（タワーを隠さない）
  const t=G.sel;if(!t)return;const pop=$('pop'),top=t.y>H/2;
  pop.style.top=top?'6px':'auto';pop.style.bottom=top?'auto':'6px';
}
function refreshPop(){
  const t=G.sel;if(!t)return;const D=DEFS[t.type];
  $('pTitle').textContent=D.name;
  $('pLv').innerHTML=[1,2,3].map(i=>`<b class="${i<=t.lv?'on':''}"></b>`).join('')+`<span>LV${t.lv}</span>`;
  const pc=$('pImg');if(pc.width!==Math.round(176*DPR)){pc.width=Math.round(176*DPR);pc.height=Math.round(140*DPR)}
  const pi=pc.getContext('2d');pi.setTransform(DPR,0,0,DPR,0,0);const pg=pi.createLinearGradient(0,0,0,140);
  pg.addColorStop(0,mix(D.rc,'#0d0b14',.85));pg.addColorStop(1,mix(D.rc,'#0d0b14',.55));pi.fillStyle=pg;pi.fillRect(0,0,176,140);drawBust(pi,t.type,88,74,.85);
  const L=t.lv-1,N=Math.min(2,L+1),bar=(lab,f)=>`<span>${lab}</span><div class="bar"><s style="width:${Math.min(100,f(N)*100)}%"></s><u style="width:${Math.min(100,f(L)*100)}%"></u></div>`;
  $('pBars').innerHTML=(D.pw?bar('効果',l=>D.pw[l]/.5):D.regen?bar('回復',l=>20/D.regen[l]):bar('威力',l=>D.dmg[l]/800))+(D.rate?bar('速さ',l=>D.rate[l]/4.4):D.slow?bar('減速',l=>D.slow[l]):'')+bar('射程',l=>D.range[l]/370);
  $('pRole').textContent=D.role;$('pop').style.setProperty('--rc',D.rc);
  // 現在の実効値（支援・呪詛の補正込み）
  {const i=t.lv-1,mD=t.mD||1,mR=t.mR||1,r=[],x=(m,s)=>Math.abs(m-1)>.005?`<em>×${m.toFixed(2)}</em>`:'';
    if(D.dmg&&D.atk!=='aura'&&D.atk!=='regen')r.push(`⚔️ 威力 ${Math.round(D.dmg[i]*mD)}${D.atk==='field'?'/秒':''}${x(mD)}`);
    if(D.rate)r.push(D.atk==='stun'?`⚡ ${(1/(D.rate[i]*mR)).toFixed(1)}秒ごと${x(mR)}`:`⚡ ${(D.rate[i]*mR).toFixed(2)}回/秒${x(mR)}`);
    r.push(`🎯 射程 ${D.range[i]}`);
    if(D.atk==='aura')r.push(`📈 ${D.aura==='dmg'?'攻撃力':'攻撃速度'}+${Math.round(D.pw[i]*100)}%`);
    if(D.regen)r.push(`💚 ${D.regen[i]}秒で封印+1`);
    if(D.inc)r.push(`💰 +${D.inc[i]}/秒`);
    if(D.push)r.push(`💨 押し戻し ${D.push[i]}`);
    if(D.slow)r.push(`🧊 減速 ${Math.round(D.slow[i]*100)}%`);
    if(D.stun)r.push(`💫 スタン ${D.stun[i]}秒`);
    if(D.dot)r.push(`🩸 出血 ${D.dot[i]}/秒`);
    r.push(`💴 投資 ${t.spent}G`);
    $('pNow').innerHTML=r.map(s=>`<span>${s}</span>`).join('')}
  $('pStat').innerHTML=descOf(t.type,t.lv)+(t.lv<3?`<br>→ LV${t.lv+1}: ${descOf(t.type,t.lv+1)}`:'<br>★ MAX LEVEL ★')+
    (countersOf(t.type).length?`<br><span style="color:#9be8c0">得意：${countersOf(t.type).map(c=>TRAIT_TXT[c]).join('・')}</span>`:'')+
    (t.mD>1||t.mR>1?`<br><span style="color:#7fb0ff">支援中：攻撃力×${t.mD.toFixed(2)} 速度×${t.mR.toFixed(2)}${t.sight?'・見破り':''}</span>`:'')+
    (t.hexT>0?`<br><span style="color:#d48aff">呪詛：攻撃速度ダウン（あと${Math.ceil(t.hexT)}秒）</span>`:'');
  const up=$('pUp');
  if(t.lv>=3){up.textContent='LV MAX';up.disabled=true}
  else{const c=upCost(t);up.textContent=`LV UP（強化） ${c}G`;up.disabled=G.money<c}
  // 必殺技：効果とチャージ状況＋このキャラだけの発動ボタン（常設ボタンは置かない）
  $('pSpI').innerHTML=`✦ <b>必殺『${D.sp}』</b> ${t.spCd>0?`チャージ中 あと${Math.ceil(t.spCd)}秒`:'<b>準備OK</b>'}<br>${spDesc(t.type,t.lv)}`+
    `<small>${AUTO.sp?'必殺技AUTO：ON（最適なタイミングで自動発動）':'下のボタンで発動／「必殺技AUTO」ONで自動発動'}</small>`;
  {const sp=$('pSp'),live=(G.state==='wave'||G.state==='ready')&&(alive().length>0||D.sk==='heal'),rd=t.spCd<=0;
    sp.disabled=!rd||!live;sp.classList.toggle('ready',rd&&live);
    sp.textContent=!rd?`必殺 チャージ中 ${Math.ceil(t.spCd)}s`:live?`✦ 必殺技『${D.sp}』発動！`:'必殺 準備OK（敵が来たら撃てる）'}
  $('pCt').style.width=(100*(1-t.spCd/D.ct))+'%';
  const armed=performance.now()<sellArm;$('pSell').classList.toggle('armed',armed);
  $('pSell').textContent=armed?`⚠ もう一度タップで撤去（+${Math.floor(t.spent*.6)}G）`:`🗑️ 撤去（売却 +${Math.floor(t.spent*.6)}G）`;
}
let last={};
function syncUI(force){
  const m=Math.floor(G.money);
  if(force||last.m!==m){$('money').innerHTML=`呪力 <b>${m}</b>`;last.m=m;for(const k in cards)cards[k].classList.toggle('poor',m<costOf(k))}
  if(force||last.l!==G.life){$('life').innerHTML=`封印 <b>${G.life}</b>`;last.l=G.life}
  $('stage').innerHTML=`STAGE <b>${G.stage}</b>`;
  $('wvN').textContent=G.wave;
  const segs=$('wgauge').children,prog=G.state==='wave'&&G.waveTotal?1-(G.queue.length+G.enemies.length)/G.waveTotal:1;
  for(let i=0;i<5;i++){const n=i+1,f=n<G.wave||(n===G.wave&&G.state!=='wave')?1:n===G.wave?Math.max(0,prog):0;
    segs[i].firstChild.style.width=(f*100)+'%';segs[i].classList.toggle('now',n===G.wave&&G.state==='wave')}
  // 配置モード中は WAVE開始 の場所に大きな「配置キャンセル」を出す
  $('cancelPlace').style.display=G.placing?'block':'none';$('next').style.display=G.placing?'none':'';
  const nd=G.state!=='ready'||G.wave>=5;$('next').disabled=nd;$('next').textContent=G.wave>=5?'WAVE開始 ▶':`WAVE ${G.wave+1} 開始 ▶`;
  for(const k in cards)cards[k].classList.toggle('sel',G.placing===k);
  const hint=$('hint');
  // 配置中：選んだキャラのミニ情報（役割・LV1性能・必殺）＋操作の案内
  if(G.placing){const k=G.placing,D=DEFS[k];hint.style.display='block';hint.className='card-i';hint.style.setProperty('--rc',D.rc);
    if(hint.dataset.k!==k){hint.dataset.k=k;hint.innerHTML=`<span class="hn" style="color:${D.col}">${D.name}</span> ${roleBadge(k)} <b style="color:var(--gold)">${costOf(k)}G</b>
      <span class="hs">${D.role}</span><span class="hs">${descOf(k,1)} ／ 射程${D.range[0]}</span><span class="hs">✦ 必殺『${D.sp}』${spDesc(k,1)}</span><span class="hs" style="color:var(--tx)">光っているマスをタップして配置</span>`}}
  else{hint.style.display='none';hint.className='';hint.dataset.k=''}
}
function endGame(win){
  if(G.state==='win'||G.state==='lose')return;
  G.state=win?'win':'lose';closePop();G.placing=null;G.winT=0;
  if(win){markClear(LAST);showOver('🎉 ALL CLEAR!!','#ffd23f',`『呪界ディフェンス』完全制覇！<br>全${LAST}ステージ・${LAST*5}WAVE突破、呪いの王の厨房を制圧した！<br>残り封印 ${G.life}/10`,'ステージ選択へ',showTitle,null,null,
    shareText(`全${LAST}ステージ・${LAST*5}WAVEを完全制覇！呪いの王を討ち取った👑`,G.life))}
  else{track('game_over',{stage:G.stage,wave:G.wave});}
  if(!win)showOver('GAME OVER','#ff4d6d',`STAGE ${G.stage} - WAVE ${G.wave} で拠点が陥落…`,
    'このステージから再挑戦',()=>{G.money=G.stageMoney;startStage()},'ステージ選択',showTitle);
  syncUI(true);
}

// ===== リサイズ =====
function fit(){
  const r=wrap.getBoundingClientRect();
  const s=Math.max(.1,Math.min((r.width-2)/W,(r.height-2)/H)); // 余白なしで横幅いっぱい
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  const nk=Math.max(1,Math.min(3,s*(window.devicePixelRatio||1))); // 高DPIでも鮮明に（最大3倍）
  if(nk!==K||!bg||cv.width!==Math.round(W*nk)){K=nk;cv.width=Math.round(W*K);cv.height=Math.round(H*K);buildBg()}
  if(G&&G.sel)placePop();
  if($('title').style.display==='flex')drawHero();
}
window.addEventListener('resize',fit);

// ===== ループ =====
let prev=performance.now(),uiT=0;
function loop(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  // カットイン中はスローモーション
  const sdt=dt*G.speed*(G.cutin&&G.cutin.el<1.5?.3:1);
  // 倍速でも判定が粗くならないよう 1/60 秒刻みで更新
  const live=()=>(G.state==='ready'||G.state==='wave')&&!G.paused;
  for(let rem=sdt;rem>1e-6&&live();rem-=1/60)update(Math.min(rem,1/60));
  updateFx(sdt,dt);
  draw();
  if(window.__post&&location.hash==='#debug')window.__post(ctx); // 検証用フック（#debug時のみ）
  uiT+=dt;if(uiT>.1){uiT=0;syncUI(false);if(G.sel)refreshPop()}
  requestAnimationFrame(loop);
}
newGame(1);fit();showTitle();
if(location.hash==="#debug")window.__td={get G(){return G},updateFx,upgrade,posAt,get AUTOv(){return AUTO},special,startStage,setupStage,update,makeWave,newGame,buildPanel,recommendDeck,openDeck,STAGES,DEFS,ETYPES,CHAR_IDS,hpMul,bossHp,stageMoney,costOf,upOf,COST_A,HP_A,BOSS_A,MONEY_A,AREA_ARM,
  drawBust,drawUnit,drawCutHand,evilSky,drawEnemy,ETY:ETYPES,canPlace,AUTO,get grid(){return grid},get PATH(){return PATH},get pathLen(){return pathLen},next:()=>$('next').onclick()};
requestAnimationFrame(loop);
})();
</script>
